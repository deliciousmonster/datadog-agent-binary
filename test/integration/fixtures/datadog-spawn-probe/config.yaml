# A config.yaml replaces Harper's default component config entirely (no merge),
# so this declares exactly what the probe needs.
#
# There is deliberately no `rest: true` and no exported Resource. Every probe runs
# at module load, which happens once in each worker thread; an HTTP-driven probe
# would only ever reach the thread that served the request, and on macOS and
# Windows that is always the same thread (without SO_REUSEPORT the main thread
# binds the ports and serves alone).
jsResource:
  files: resources.js
