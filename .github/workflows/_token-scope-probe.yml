# TEMPORARY. Asks whether this repo's NPM_TOKEN can also publish @deliciousmonster.
# Read-only: whoami and an access listing. Never echoes the token. Delete after reading.
name: Token scope probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Who does this token authenticate as
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami || echo "whoami failed"
      - name: Can it write @deliciousmonster
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- @deliciousmonster ---"
          npm access list packages @deliciousmonster 2>&1 | head -20 || echo "no access to @deliciousmonster"
          echo "--- @harperfast (the scope it is known to publish) ---"
          npm access list packages @harperfast 2>&1 | head -5 || echo "no access to @harperfast"
