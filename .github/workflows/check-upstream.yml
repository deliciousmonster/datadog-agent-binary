name: Check for New Datadog Agent Releases

on:
  #schedule:
  # Disabled for now until / unless we revisit using this
  # Run daily at 10:00 UTC
  #- cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    # GitHub's release API and a git push are the only external calls here; they don't hang for hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Reads package.json's engines.node, the one already-checked-in source of truth - no
          # separate Actions variable to keep in sync with it.
          node-version-file: "package.json"
          cache: "npm"

      # Not --omit optional: TypeScript 7 ships its compiler as a platform-specific optional
      # dependency, so omitting them leaves tsc unable to resolve its own binary.
      - name: Install dependencies
        run: npm ci

      - name: Check for new upstream release
        run: |
          # Get latest Datadog Agent release with error handling
          echo "Fetching latest Datadog Agent release..."
          # -f makes curl fail on a 4xx/5xx response; plain -s exits 0 even on those,
          # so without it this check only ever caught a dead connection.
          RESPONSE=$(curl -sf https://api.github.com/repos/DataDog/datadog-agent/releases/latest)

          # Check if curl succeeded
          if [ $? -ne 0 ]; then
            echo "Error: Failed to fetch release data from GitHub API"
            exit 1
          fi

          # Debug: show the response
          echo "API Response: $RESPONSE"

          # Extract tag name
          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r '.tag_name')

          # Check if jq extraction succeeded
          if [ "$LATEST_RELEASE" = "null" ] || [ -z "$LATEST_RELEASE" ]; then
            echo "Error: Failed to extract tag_name from API response"
            echo "Response was: $RESPONSE"
            exit 1
          fi

          echo "Latest upstream release: $LATEST_RELEASE"

          # Check if we already have this version tagged (with v prefix)
          if git tag --list | grep -q "^v${LATEST_RELEASE}$"; then
            echo "Version v$LATEST_RELEASE already exists"
          else
            echo "New version found: $LATEST_RELEASE"
            echo "Creating tag: v$LATEST_RELEASE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            npm version "v$LATEST_RELEASE"

            # npm version's local commit has to reach main too, or main's committed version
            # permanently drifts from the tag this run just produced.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "v$LATEST_RELEASE"
          fi
