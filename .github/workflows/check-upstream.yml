name: Check for New Datadog Agent Releases

# DISABLED, and do not re-enable without fixing this first: the job tags the npm
# package `v<upstream release>` but never writes .datadog-agent-version, which is
# what src/downloader.ts actually builds from. Running it today would publish a
# package labelled with one Datadog Agent release built from another, the exact
# mislabelling that produced a package versioned 7.75.5 containing agent 7.79.2.
# Whatever bumps the tag must bump the pin in the same commit.

on:
  # Intended cadence when re-enabled: schedule, cron "0 10 * * *".
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit optional

      - name: Check for new upstream release
        id: check
        run: |
          echo "Fetching latest Datadog Agent release..."
          RESPONSE=$(curl -s https://api.github.com/repos/DataDog/datadog-agent/releases/latest)

          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r '.tag_name')
          if [ "$LATEST_RELEASE" = "null" ] || [ -z "$LATEST_RELEASE" ]; then
            echo "Error: Failed to extract tag_name from API response"
            echo "Response was: $RESPONSE"
            exit 1
          fi

          echo "Latest upstream release: $LATEST_RELEASE"

          if git tag --list | grep -q "^v${LATEST_RELEASE}$"; then
            echo "Version v$LATEST_RELEASE already exists"
          else
            echo "New version found: $LATEST_RELEASE"
            echo "Creating tag: v$LATEST_RELEASE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            npm version "v$LATEST_RELEASE"
            git push origin "v$LATEST_RELEASE"
          fi
