name: Build and Release Datadog Agent Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      datadog_version:
        description: "Datadog Agent version to build"
        required: false
      agent_build_args:
        description: "Override args for `dda inv agent.build` (e.g. to build a self-contained, Python-free binary). Leave blank for default."
        required: false
      trace_agent_build_args:
        description: "Override args for `dda inv trace-agent.build`. Leave blank for default (the trace-agent needs no build excludes)."
        required: false

env:
  NODE_VERSION: "22"
  # Must satisfy the go.mod `go` directive of the agent release pinned in
  # .datadog-agent-version — 7.79.x needs Go 1.25.x. Bump this when the pin moves
  # across a Go requirement.
  GO_VERSION: "1.25.8"
  # The Datadog Agent version this package BUNDLES is NOT set here. It lives in
  # .datadog-agent-version at the repo root, which src/downloader.ts reads when no
  # --datadog-version is passed. It used to be duplicated in this file, and two
  # copies of a pin are two pins: the workflow builds one release while the repo
  # claims another, and nothing compares them. A workflow_dispatch
  # `datadog_version` input still overrides it for one-off builds.

jobs:
  # Gate. test.yml runs on `push: branches: ["**"]`, which matches branches only,
  # so a tag push does not trigger it — and this workflow had no test steps of its
  # own. The net effect was that cutting a release ran zero tests against the ref
  # being published. Tagging a commit that was green on a branch is the common
  # case, but nothing enforced it: a tag on any commit published unverified.
  #
  # Deliberately the fast hermetic checks only. The real-Harper integration suite
  # lives in test.yml and takes minutes; duplicating it here would double every
  # release's critical path for a suite that already ran on the branch.
  test:
    name: test (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Run npm test
        run: npm test

  build:
    needs: test
    # Legs flagged `experimental` are allowed to fail so they don't block
    # `release`/`publish`, which depend on this job. The publish step skips any
    # platform whose binary is missing.
    continue-on-error: ${{ matrix.experimental || false }}
    # Cap each leg so a runner that never gets scheduled (e.g. a retired runner
    # image) can't stall the whole build — and therefore the publish — for the
    # default 6h. A real agent build finishes well within this.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          #
          # glibc floor: both shipped binaries (datadog-agent and trace-agent)
          # link against whatever glibc the build runner ships, and glibc is
          # backward-compatible only upward (a binary built on an older glibc
          # runs on newer ones, not vice versa). The trace-agent is no
          # exception; its build tags include netcgo, so it is dynamically
          # linked exactly like the core agent.
          #
          # The oldest runtime we have to load on is the OSS Harper image,
          # still Debian 12 / glibc 2.36. (harper-pro has moved to
          # node:24-trixie, glibc 2.41, so it is no longer what sets this
          # floor.) We must therefore build on a runner whose glibc is <= 2.36
          # or the binaries won't load there: they would reference
          # GLIBC_2.38/2.39 symbols the image doesn't have. ubuntu-latest is
          # now Ubuntu 24.04 (glibc 2.39), so we pin to ubuntu-22.04 (glibc
          # 2.35). The agent does not actually require any newer glibc feature;
          # upstream Datadog builds against an even older glibc for portability.
          - os: ubuntu-22.04
            platform: linux-x86_64
          # GitHub-hosted arm64 runner on Ubuntu 22.04 (glibc 2.35), the arm
          # counterpart of the x86_64 pin above. If hosted arm runners aren't
          # available, swap this for any arm runner whose glibc is <= 2.36;
          # the "Verify glibc floor" step below will fail the build if it
          # isn't.
          - os: ubuntu-22.04-arm
            platform: linux-arm64

          # macOS builds
          # macOS x86_64 (Intel) is omitted: GitHub has retired the macos-13
          # Intel runner, so it can't be built on hosted runners. Re-add it with
          # a self-hosted or cross-compiling runner if Intel-mac support is
          # needed again.
          - os: macos-latest
            platform: macos-arm64

          # Windows builds
          - os: windows-latest
            platform: windows-x86_64
          # Disable Windows ARM64 builds until Chocolatey supports it
          # - os: windows-11-arm
          #   platform: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The agent version to BUILD is independent of the package release version
      # (the git tag). The tag only drives the npm package version, set in the
      # publish job.
      #
      # Only a workflow_dispatch override is resolved here. Left empty, the build
      # step passes no --datadog-version and src/downloader.ts falls back to the
      # pin in .datadog-agent-version — the one place the bundled release is
      # recorded. The pin is echoed first so the build log states which upstream
      # release this artifact came from even on the default path.
      - name: Resolve Datadog Agent version to build (Unix)
        if: runner.os != 'Windows'
        id: extract_version_unix
        run: |
          echo "Pinned in .datadog-agent-version: $(cat .datadog-agent-version)"
          echo "version=${{ github.event.inputs.datadog_version }}" >> $GITHUB_OUTPUT

      - name: Resolve Datadog Agent version to build (Windows)
        if: runner.os == 'Windows'
        id: extract_version_windows
        run: |
          echo "Pinned in .datadog-agent-version: $(Get-Content .datadog-agent-version)"
          echo "version=${{ github.event.inputs.datadog_version }}" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # One build step produces BOTH binaries: src/builders/base.ts iterates
      # platform.getBinaries() and runs `dda inv <buildTask>` per descriptor. Each
      # descriptor names its own override env var, so core and trace-agent flags
      # cannot be aimed at the wrong target.
      - name: Build ${{ matrix.platform }} (Unix)
        if: runner.os != 'Windows'
        env:
          DEBUG: true
          DD_AGENT_BUILD_ARGS: ${{ github.event.inputs.agent_build_args }}
          DD_TRACE_AGENT_BUILD_ARGS: ${{ github.event.inputs.trace_agent_build_args }}
        run: |
          if [ -n "${{ steps.extract_version_unix.outputs.version }}" ]; then
            node dist/cli.js build --datadog-version ${{ steps.extract_version_unix.outputs.version }}
            ls -l build/${{ matrix.platform }}/bin/
          else
            node dist/cli.js build
          fi

      - name: Build ${{ matrix.platform }} (Windows)
        if: runner.os == 'Windows'
        env:
          DEBUG: true
          DD_AGENT_BUILD_ARGS: ${{ github.event.inputs.agent_build_args }}
          DD_TRACE_AGENT_BUILD_ARGS: ${{ github.event.inputs.trace_agent_build_args }}
        run: |
          if ("${{ steps.extract_version_windows.outputs.version }}" -ne "") {
            node dist/cli.js build --datadog-version ${{ steps.extract_version_windows.outputs.version }}
          } else {
            node dist/cli.js build
          }
        shell: pwsh

      # Prove every binary we ship actually runs as a standalone file BEFORE we
      # ship it. We hide the build tree first so a binary that still links
      # libraries by their build-time path (e.g. librtloader) can't be
      # satisfied; that's the exact failure that only shows up on a user's
      # machine. A self-contained binary runs fine; a non-relocatable one fails
      # here and blocks the release instead of publishing something that won't
      # start.
      #
      # The loop over BOTH binaries is load-bearing. The package once shipped
      # with the core agent only: nothing bound 127.0.0.1:8126, dd-trace got
      # ECONNREFUSED, and every span was dropped in silence. A missing binary is
      # a hard failure here, not a warning.
      - name: Smoke test ${{ matrix.platform }} binaries run standalone (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          bindir="build/${{ matrix.platform }}/bin"
          src="build/${{ matrix.platform }}/src"
          [ -d "$src" ] && mv "$src" "${src}.hidden" || true

          rc=0
          for name in datadog-agent trace-agent; do
            bin="$bindir/$name"
            if [ ! -x "$bin" ]; then
              echo "::error::$bin was not built. Both the core agent and the trace-agent must ship; without trace-agent nothing listens on 8126 and every span is dropped silently."
              rc=1
              continue
            fi
            echo "Running: $bin version (build tree hidden)"
            "$bin" version || { echo "::error::$bin failed to run standalone."; rc=1; }
          done

          [ -d "${src}.hidden" ] && mv "${src}.hidden" "$src" || true
          exit "$rc"

      # The Windows counterpart. This leg previously had no smoke test at all, so
      # the .exe path through descriptors -> build -> copy -> package -> resolve
      # was compiled and never once executed; combined with `continue-on-error` on
      # experimental legs, a broken Windows build could publish. Same contract as
      # the Unix step: hide the build tree so a binary that still resolves a
      # library by its build-time path cannot be satisfied, then run both.
      - name: Smoke test ${{ matrix.platform }} binaries run standalone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bindir = "build/${{ matrix.platform }}/bin"
          $src    = "build/${{ matrix.platform }}/src"
          $hidden = "$src.hidden"
          if (Test-Path $src) { Move-Item $src $hidden }

          $rc = 0
          foreach ($name in @('datadog-agent.exe', 'trace-agent.exe')) {
            $bin = Join-Path $bindir $name
            if (-not (Test-Path $bin)) {
              Write-Output "::error::$bin was not built. Both the core agent and the trace-agent must ship; without trace-agent nothing listens on 8126 and every span is dropped silently."
              $rc = 1
              continue
            }
            Write-Output "Running: $bin version (build tree hidden)"
            & $bin version
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::$bin failed to run standalone (exit $LASTEXITCODE)."
              $rc = 1
            }
          }

          if (Test-Path $hidden) { Move-Item $hidden $src }
          exit $rc

      # `version` only proves the file loads. This proves the APM receiver
      # actually works: start the trace-agent, wait for it to bind
      # 127.0.0.1:8126, and submit a trace payload the way dd-trace does. The
      # original defect shipped a package where nothing ever listened on 8126,
      # and every "is the file there" check passed anyway.
      #
      # The trace-agent dies at startup unless datadog.yaml EXISTS (0 bytes is
      # enough; every setting below arrives through the environment) and its
      # config and run directories are writable, so the whole run lives in one
      # temp dir. Nothing leaves the runner: the hostname is pinned so no cloud
      # metadata is probed, remote config is off, and the trace writer points at
      # a dead local port, so submitted payloads are accepted by the receiver
      # and then fail to forward, which is all this test needs.
      # Runs on every Unix leg, not just Linux. The receiver is the whole point of
      # shipping a second binary, so proving it works on only one of the platforms
      # we publish leaves the others resting on "the file exists". Verified by hand
      # on darwin/arm64 before widening this: a trace-agent built from the pin binds
      # 8126, answers /info, and accepts a v0.4 payload there exactly as on Linux.
      - name: Verify APM receiver accepts traces (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/build/${{ matrix.platform }}/bin/trace-agent"
          work="$(mktemp -d)"
          pid=""

          dump_logs() {
            echo "--- trace-agent console ---"
            cat "$work/console.log" 2>/dev/null || echo "(none)"
            echo "--- trace-agent log file ---"
            cat "$work/trace-agent.log" 2>/dev/null || echo "(none)"
          }
          cleanup() {
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          mkdir -p "$work/conf.d" "$work/run"
          : > "$work/datadog.yaml"

          export DD_API_KEY=dummy
          export DD_HOSTNAME=ci-apm-smoke
          export DD_CONFD_PATH="$work/conf.d"
          export DD_RUN_PATH="$work/run"
          export DD_AUTH_TOKEN_FILE_PATH="$work/auth_token"
          export DD_IPC_CERT_FILE_PATH="$work/ipc_cert.pem"
          export DD_LOG_FILE="$work/trace-agent.log"
          export DD_BIND_HOST=127.0.0.1
          export DD_APM_ENABLED=true
          export DD_APM_RECEIVER_PORT=8126
          export DD_REMOTE_CONFIGURATION_ENABLED=false
          export DD_APM_DD_URL=http://127.0.0.1:1

          "$bin" run -c "$work/datadog.yaml" > "$work/console.log" 2>&1 &
          pid=$!
          echo "trace-agent running as pid $pid out of $work"

          # 60 * 0.5s = 30s ceiling. Bail the moment the process dies so a
          # startup failure reports in a second instead of after the timeout.
          ready=0
          for _ in $(seq 1 60); do
            # No -S here: a connection refused on every attempt until the
            # listener is up is expected, and printing it 60 times buries the
            # real failure when there is one.
            if curl -fs --max-time 2 http://127.0.0.1:8126/info -o "$work/info.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::trace-agent exited before it bound 127.0.0.1:8126."
              dump_logs
              exit 1
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::trace-agent never answered http://127.0.0.1:8126/info within 30s."
            dump_logs
            exit 1
          fi

          echo "--- /info ---"
          cat "$work/info.json"
          echo

          # Parse the JSON rather than grepping it: the point is that the
          # receiver ADVERTISES the endpoint dd-trace posts to, not that the
          # string appears somewhere in the response.
          python3 - "$work/info.json" <<'PY'
          import json, sys

          with open(sys.argv[1]) as fh:
              info = json.load(fh)
          endpoints = info.get("endpoints") or []
          if "/v0.4/traces" not in endpoints:
              print(f"::error::/info does not advertise /v0.4/traces (endpoints: {endpoints})")
              sys.exit(1)
          print(f"/info advertises /v0.4/traces (trace-agent version {info.get('version')})")
          PY

          code=$(curl -sS -o "$work/put.out" -w '%{http_code}' --max-time 10 \
            -X PUT -H 'Content-Type: application/json' --data '[]' \
            http://127.0.0.1:8126/v0.4/traces)
          echo "PUT /v0.4/traces -> HTTP $code, body: $(cat "$work/put.out")"
          if [ "$code" != "200" ]; then
            echo "::error::PUT /v0.4/traces returned HTTP $code, expected 200."
            dump_logs
            exit 1
          fi

          echo "OK: trace-agent bound 127.0.0.1:8126 and accepted a trace payload."

      # Guard against the symbol floor creeping back up, for EVERY binary we
      # ship. The trace-agent carries the netcgo build tag, so it is dynamically
      # linked against glibc just like the core agent and has to clear the same
      # floor; checking datadog-agent alone would let through a trace-agent that
      # cannot load on the image.
      #
      # The floor is 2.36 because the OSS Harper image is Debian 12. This step's
      # older rationale named the Harper Pro image as the constraint, which is
      # now stale (harper-pro runs node:24-trixie, glibc 2.41). The number is
      # unchanged; the reason for it is not.
      #
      # glibc and libstdc++ are two SEPARATE libraries: the glibc floor is set
      # by the runner's Ubuntu version, the GLIBCXX floor by its GCC version. A
      # binary must not reference a symbol newer than either, or it fails to
      # load with "version `GLIBC_2.xx' not found" or "version `GLIBCXX_3.4.xx'
      # not found". The latter is the exact error the Macy's deploy hit on
      # rocksdb-js. Building on ubuntu-22.04 (glibc 2.35, GCC 11 ->
      # GLIBCXX_3.4.29) keeps both under the limit, and this step fails the
      # build loudly if either floor is exceeded so we catch it in CI instead of
      # on a customer's instance.
      - name: Verify glibc / libstdc++ floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          check() {
            local binpath="$1" label="$2" prefix="$3" limit="$4" max
            # GLIBC_ won't match GLIBCXX_ (char after GLIBC is X, not _), so the
            # two families are counted independently.
            max=$(strings -a "$binpath" | grep -o "${prefix}_[0-9.]\+" | sed "s/${prefix}_//" | sort -uV | tail -1)
            echo "$(basename "$binpath") ${label}: references up to ${prefix}_${max:-<none>}; image provides ${prefix}_${limit}"
            if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$limit" "$max" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::$(basename "$binpath") requires ${prefix}_${max} but the oldest Harper runtime image only provides ${prefix}_${limit}. Build on an older toolchain (glibc <= 2.36, GCC <= 12) so it loads on the image."
              return 1
            fi
            return 0
          }

          bindir="build/${{ matrix.platform }}/bin"
          rc=0
          for name in datadog-agent trace-agent; do
            bin="$bindir/$name"
            if [ ! -f "$bin" ]; then
              echo "::error::$bin is missing, so its symbol floor was never checked."
              rc=1
              continue
            fi
            check "$bin" "glibc"     "GLIBC"    "2.36"   || rc=1
            check "$bin" "libstdc++" "GLIBCXX"  "3.4.30" || rc=1
          done
          if [ "$rc" -eq 0 ]; then
            echo "OK: every shipped binary stays within the oldest Harper image's glibc and libstdc++ versions."
          fi
          exit "$rc"

      # The artifact is the whole bin/ directory, which is how both binaries
      # travel to the release and publish jobs. Assert they are both present
      # first: Windows has no smoke test above, so a half-empty bin/ would sail
      # through here and only surface as a missing trace-agent at install time.
      - name: Verify both binaries are present for upload
        shell: bash
        run: |
          set -e
          bindir="build/${{ matrix.platform }}/bin"
          ext=""
          if [ "${RUNNER_OS:-}" = "Windows" ]; then ext=".exe"; fi
          ls -l "$bindir"
          rc=0
          for name in datadog-agent trace-agent; do
            if [ ! -f "$bindir/${name}${ext}" ]; then
              echo "::error::$bindir/${name}${ext} is missing; the ${{ matrix.platform }} artifact would ship incomplete."
              rc=1
            fi
          done
          exit "$rc"

      # Uploading the directory (not a single file) is what carries the core
      # agent AND the trace-agent, plus anything else the build drops in bin/.
      # if-no-files-found: error stops a build that produced nothing from
      # publishing an empty artifact that the publish job would then skip in
      # silence.
      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/bin/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Create compressed archives for each platform
          cd artifacts

          echo "Recursively listing files in artifacts:"
          ls -lR

          # Linux platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-linux-${arch}" ]; then
              cd "agent-linux-${arch}"
              tar -czf "../../release-assets/datadog-agent-${{ github.ref_name }}-linux-${arch}.tar.gz" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

          # macOS platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-macos-${arch}" ]; then
              cd "agent-macos-${arch}"
              tar -czf "../../release-assets/datadog-agent-${{ github.ref_name }}-macos-${arch}.tar.gz" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

          # Windows platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-windows-${arch}" ]; then
              cd "agent-windows-${arch}"
              zip -r "../../release-assets/datadog-agent-${{ github.ref_name }}-windows-${arch}.zip" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

      - name: Generate checksums
        run: |
          echo "Listing current dir"
          ls -l
          echo "Listing release-assets dir"
          ls -l release-assets/
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Datadog Agent ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
          body: |
            # @deliciousmonster/datadog-agent-binary ${{ github.ref_name }}

            Pre-compiled Datadog Agent binaries for all supported platforms.

            Every archive carries BOTH processes: `datadog-agent` (the core
            agent) and `trace-agent` (the APM receiver that binds
            127.0.0.1:8126). Tracing needs the trace-agent, not the core agent,
            so an archive with only `datadog-agent` in it is broken.

            ## Supported Platforms

            - **Linux x86_64**: `datadog-agent-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - **Linux arm64**: `datadog-agent-${{ github.ref_name }}-linux-arm64.tar.gz`
            - **macOS x86_64**: `datadog-agent-${{ github.ref_name }}-macos-x86_64.tar.gz`
            - **macOS arm64**: `datadog-agent-${{ github.ref_name }}-macos-arm64.tar.gz`
            - **Windows x86_64**: `datadog-agent-${{ github.ref_name }}-windows-x86_64.zip`

            ## NPM Package

            ```bash
            npm install @deliciousmonster/datadog-agent-binary
            ```

            ## Verification

            ```bash
            sha256sum -c checksums.txt
            ```

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List binaries
        run: |
          echo "Listing artifacts dir"
          ls -l artifacts/
          echo "Listing artifacts subdirs"
          ls -l artifacts/*

      - name: Move binaries to build dirs
        run: |
          echo "Listing artifacts dir again"
          ls -l artifacts/
          pushd artifacts
          for artifact in *
          do
            platform=${artifact#agent-}
            echo "Moving contents of $artifact into ../build/$platform/bin/"
            ls -l "$artifact"
            mkdir -p "../build/$platform/bin"
            mv "$artifact"/* "../build/$platform/bin/"
          done
          popd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The release tag (vX.Y.Z) is the version everything is published at, so
      # the npm package version must match it. This runs the `version` lifecycle
      # script (build + update-optional-deps), keeping optionalDependencies
      # pinned to the same version. --allow-same-version makes re-runs safe.
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting npm package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Prerelease tags (anything with a hyphen, e.g. v7.75.5-next.4) publish
      # under the `next` dist-tag so they do NOT move `latest`. Stable tags
      # publish under `latest` as usual.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing under npm dist-tag: $TAG"

      - name: Prepare platform packages with binaries
        run: |
          node scripts/create-platform-packages.js --all

      # THE GATE. This is the last moment the answer can still change anything: the
      # tarballs exist but nothing is public, so a failure here is free. Once
      # `npm publish` runs, a version number is burned forever — it can be deprecated
      # but never replaced.
      #
      # Reads the staged npm/ dirs offline and fails on any of the three defects this
      # project actually shipped: os/cpu carrying our internal names instead of Node's
      # (so npm can never match the package), a platform declared in
      # optionalDependencies but never built, and a package missing the trace-agent.
      # All three fail silently at install time, which is why they need to fail loudly
      # here.
      - name: Verify the platform matrix before publishing
        run: node scripts/publish-matrix.js --local ./npm

      - name: Publish platform packages
        run: |
          for platform_dir in npm/*/; do
            platform=$(basename "$platform_dir")
            echo "Publishing platform package: $platform"

            cd "$platform_dir"

            # Check if binaries exist
            if [ -d "bin" ] && [ "$(ls -A bin)" ]; then
              npm publish --access public --tag ${{ steps.disttag.outputs.tag }}
              echo "Published @deliciousmonster/datadog-agent-binary-$platform"
            else
              echo "Skipping $platform - no binaries found"
            fi

            cd - > /dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --access public --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The receipt: what actually landed on the registry, not what we believed we sent.
      #
      # MATRIX_RETRIES is load-bearing. Publishing is not read-your-writes — a fetch
      # immediately after `npm publish` can 404 or return stale metadata. Without the
      # retry this step goes intermittently red for a reason unrelated to the release,
      # and a check people learn to ignore is worse than no check.
      #
      # --deep downloads each tarball and lists bin/ exactly, rather than inferring from
      # fileCount. It costs a few hundred MB of transfer once per release, which is the
      # right trade for the one artifact nobody can re-cut.
      # VERSION is re-derived from the tag rather than carried over: it was a shell
      # local in "Set package version from tag" and does not survive into later steps.
      - name: Verify the published matrix
        env:
          MATRIX_RETRIES: "12"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-matrix.js --registry "$VERSION" --deep

      # Render the same table into the job summary and the Release body, so the matrix
      # lives where someone actually looks rather than only in a log that scrolls away.
      # Non-blocking: the verification above is the gate, and failing a release over a
      # notes edit would be the tail wagging the dog.
      - name: Append the matrix to the release notes
        continue-on-error: true
        env:
          MATRIX_RETRIES: "12"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-matrix.js --registry "$VERSION" --markdown > matrix.md
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"

          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          printf '\n\n' >> notes.md
          cat matrix.md >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
