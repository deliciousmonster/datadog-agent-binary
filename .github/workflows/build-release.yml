name: Build and Release Datadog Agent Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      datadog_version:
        description: "Datadog Agent version to build"
        required: false
      agent_build_args:
        description: "Override args for `dda inv agent.build` (e.g. to build a self-contained, Python-free binary). Leave blank for default."
        required: false

env:
  GO_VERSION: "1.23"

jobs:
  # The single source of the release version, so build and publish agree on it. Nothing else:
  # a cold tsc is under half a second, so compiling here and shipping dist/ around cost more
  # than it saved and serialised the whole matrix behind a job that only reads a ref.
  prepare:
    runs-on: ubuntu-latest
    # Reading a ref and writing one output. No checkout, no install.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      # The package version, from the tag alone. The Datadog version is a different number that the
      # build reads from .datadog-agent-version; the two share a numeric core and nothing else.
      - name: Extract version from tag
        id: extract_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    # No leg below sets `experimental`, so this is always false: a real failure fails the job
    # outright, taking release/publish down with it.
    continue-on-error: false
    # Cap each leg so a runner that never gets scheduled (e.g. a retired runner
    # image) can't stall the whole build — and therefore the publish — for the
    # default 6h. A real agent build finishes well within this.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          #
          # glibc floor: the agent binary links against whatever glibc the
          # build runner ships, and glibc is backward-compatible only upward
          # (a binary built on an older glibc runs on newer ones, not vice
          # versa). The Harper Pro runtime image is Debian 12 (glibc 2.36), so
          # we must build on a runner whose glibc is <= 2.36 or the binary
          # won't load there (it would reference GLIBC_2.38/2.39 symbols that
          # don't exist on the image). ubuntu-latest is now Ubuntu 24.04
          # (glibc 2.39), so we pin to ubuntu-22.04 (glibc 2.35). The agent
          # does not actually require any newer glibc feature; upstream
          # Datadog builds against an even older glibc for portability.
          - os: ubuntu-22.04
            platform: linux-x86_64
          # GitHub-hosted arm64 runner on Ubuntu 22.04 (glibc 2.35), the arm
          # counterpart of the x86_64 pin above. If hosted arm runners aren't
          # available, swap this for any arm runner whose glibc is <= 2.36;
          # the "Verify glibc floor" step below will fail the build if it
          # isn't.
          - os: ubuntu-22.04-arm
            platform: linux-arm64

          # macOS builds
          # macOS x86_64 (Intel) is omitted: GitHub has retired the macos-13
          # Intel runner, so it can't be built on hosted runners. Re-add it with
          # a self-hosted or cross-compiling runner if Intel-mac support is
          # needed again.
          - os: macos-latest
            platform: macos-arm64

          # Windows builds
          - os: windows-latest
            platform: windows-x86_64
          # Disable Windows ARM64 builds until Chocolatey supports it
          # - os: windows-11-arm
          #   platform: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Reads package.json's engines.node, the one already-checked-in source of truth - no
          # separate Actions variable to keep in sync with it.
          node-version-file: "package.json"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The agent build fills the ubuntu image: 73 GiB root with about 12 GiB free at start, no
      # second volume to move to. None of these paths is loaded by this build; removing them returns ~18 GiB.
      - name: Reclaim disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          avail() { df --output=avail -k / | tail -1; }
          before="$(avail)"
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            [ -e "$path" ] || continue
            sudo rm -rf "$path" || echo "could not remove $path, continuing"
          done
          echo "Reclaimed $(( ($(avail) - before) / 1024 )) MiB on /"
          df -h /

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build ${{ matrix.platform }}
        shell: bash
        env:
          DEBUG: true
          DD_AGENT_BUILD_ARGS: ${{ github.event.inputs.agent_build_args }}
          # The dispatch input reaches bash as an environment value, never as source. Spliced through
          # ${{ }} it is shell text, and `7.0.0 ; touch pwned ; #` executes on the runner. Absent, the
          # build reads .datadog-agent-version; the tag's version is never a Datadog ref.
          DATADOG_VERSION: ${{ github.event.inputs.datadog_version }}
        run: |
          args=()
          if [ -n "$DATADOG_VERSION" ]; then args=(--datadog-version "$DATADOG_VERSION"); fi
          node dist/src/cli.js build "${args[@]}"
          ls -l "build/${{ matrix.platform }}/bin/"

      # The agent build starts a Bazel server (the config-schema step does, whatever the rtloader flags
      # say) and that server outlives the build holding the source tree open. On Windows a held handle
      # makes renaming the tree EBUSY, which is what the smoke test was working around for ten seconds
      # and then giving up on. Shutting the daemon down is the build's job, not the next step's problem.
      - name: Stop the Bazel daemon the build started
        if: always()
        shell: bash
        run: |
          cd "build/${{ matrix.platform }}/src" || exit 0
          ./tools/bazel shutdown || bazel shutdown || echo "no bazel to shut down"

      # Proves the binaries are real before we ship them, on every OS Windows included (bash is
      # already relied on there elsewhere in this file). The script hides build/<platform>/src itself.
      - name: Smoke test ${{ matrix.platform }} binaries
        shell: bash
        run: node scripts/smoke-test-binaries.js "build/${{ matrix.platform }}/bin"

      # MOD-16's equivalence property (harperSupervisor and guardSupervisor deliver the same trace
      # count for the same input) against these same real binaries, on every leg this matrix builds -
      # not just wherever a developer happens to have the locally-patched Harper test/live/ needs.
      #
      # Calls node --test directly, not `npm run test:binaries`: that script's own `npm run
      # build` prefix would recompile dist/ from scratch, already current from the step above.
      # Windows runs the same directory through the gate, which subtracts what windows-gate-checks.mjs
      # names and refuses a run that executed nothing. The step limit is for a runner a leaked agent
      # keeps alive: a hang here once cost the leg its whole 60-minute job. One file at a time: both
      # suites take the same lock on build/, and the equivalence suite holds it longer than the other
      # waits, so in parallel the second one times out on the lock whenever it starts second.
      - name: Supervision equivalence test (native vs guard, real binaries)
        shell: bash
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node scripts/windows-gate.mjs --binaries
          else
            node --test --test-concurrency=1 --test-timeout=120000 "test/binaries/**/*.test.js"
          fi

      # Guard against the symbol floor creeping back up. The Harper Pro runtime
      # image (Debian 12) provides glibc 2.36 (libc.so.6) AND libstdc++
      # GLIBCXX_3.4.30 (from GCC 12). These are two SEPARATE libraries: the
      # glibc floor is set by the runner's Ubuntu version, the GLIBCXX floor by
      # its GCC version. The agent binary must not reference a symbol newer than
      # either, or it fails to load on the image with "version `GLIBC_2.xx' not
      # found" or "version `GLIBCXX_3.4.xx' not found" — the latter is the exact
      # error the Macy's deploy hit on rocksdb-js. Building on ubuntu-22.04
      # (glibc 2.35, GCC 11 -> GLIBCXX_3.4.29) keeps both under the limit. This
      # step fails the build loudly if either floor is exceeded, so we catch it
      # in CI instead of on a customer's instance.
      - name: Verify glibc / libstdc++ floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          # Derived, not hardcoded: a second binary added to BINARIES is covered here automatically.
          bins=$(node -e "console.log(require('./dist/src/binaries.js').BINARIES.map(b=>b.shipsAs).join(' '))")

          check() {
            bin="$1"; label="$2"; prefix="$3"; limit="$4"
            # GLIBC_ won't match GLIBCXX_ (char after GLIBC is X, not _), so the
            # two families are counted independently.
            max=$(strings -a "$bin" | grep -o "${prefix}_[0-9.]\+" | sed "s/${prefix}_//" | sort -uV | tail -1)
            echo "${label}: binary references up to ${prefix}_${max:-<none>}; image provides ${prefix}_${limit}"
            if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$limit" "$max" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::${bin} requires ${prefix}_${max} but the Harper Pro runtime image only provides ${prefix}_${limit}. Build on an older toolchain (glibc <= 2.36, GCC <= 12) so the agent loads on the image."
              return 1
            fi
            return 0
          }

          rc=0
          for name in $bins; do
            bin="build/${{ matrix.platform }}/bin/${name}"
            check "$bin" "${name} glibc"     "GLIBC"   "2.36"   || rc=1
            check "$bin" "${name} libstdc++" "GLIBCXX" "3.4.30" || rc=1
          done
          if [ "$rc" -eq 0 ]; then
            echo "OK: all binaries stay within the Harper Pro image's glibc and libstdc++ versions."
          fi
          exit "$rc"

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/bin/
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # GitHub's release-creation API is the only external call here; it doesn't hang for hours.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Named by pattern, not unfiltered: the loop below turns every entry under artifacts/ into a
      # release asset, so anything a later job uploads must not silently become one.
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          path: artifacts/

      # Git permits ; $() ` && and | in a tag name, so ref_name spliced into a run body is shell
      # source. It arrives as a value, like every other untrusted input in this workflow.
      #
      # Driven off the downloaded agent-* directory names (same idea as publish's "Move binaries
      # to build dirs" step) instead of a hardcoded arch list, so a matrix change needs no edit here.
      - name: Prepare release assets
        id: prepare_assets
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          platforms_file="$RUNNER_TEMP/platforms.md"
          : > "$platforms_file"

          cd artifacts


          for artifact in agent-*; do
            [ -d "$artifact" ] || continue
            platform=${artifact#agent-}
            os=${platform%%-*}
            arch=${platform#*-}
            case "$os" in
              linux) label="Linux" ;;
              macos) label="macOS" ;;
              windows) label="Windows" ;;
              *) label="$os" ;;
            esac

            cd "$artifact"
            if [ "$os" = "windows" ]; then
              file="datadog-agent-${REF_NAME}-${platform}.zip"
              zip -r "../../release-assets/${file}" ./*
            else
              file="datadog-agent-${REF_NAME}-${platform}.tar.gz"
              tar -czf "../../release-assets/${file}" ./*
            fi
            echo "- **${label} ${arch}**: \`${file}\`" >> "$platforms_file"
            cd ..
          done


          {
            echo "platforms<<PLATFORMS_EOF"
            cat "$platforms_file"
            echo "PLATFORMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum ./* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Datadog Agent ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
          body: |
            # @deliciousmonster/datadog-agent-binary ${{ github.ref_name }}

            Pre-compiled Datadog Agent binaries for all supported platforms.

            ## Supported Platforms

            ${{ steps.prepare_assets.outputs.platforms }}

            ## NPM Package

            ```bash
            npm install @deliciousmonster/datadog-agent-binary
            ```

            ## Verification

            ```bash
            sha256sum -c checksums.txt
            ```

  publish:
    needs: [build, prepare]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      # npm authenticates with this OIDC token: a trusted publisher on each of the five packages names
      # this repository and this workflow file, and provenance is attached from the same token. No npm
      # token exists on this repository.
      id-token: write
    # npm publish is the only external call here; it doesn't hang for hours.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Named by pattern, not unfiltered: "Move binaries to build dirs" below treats every entry
      # under artifacts/ as one platform's binary set.
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          path: artifacts/

      - name: Move binaries to build dirs
        run: |
          pushd artifacts
          for artifact in *
          do
            platform=${artifact#agent-}
            echo "Moving contents of $artifact into ../build/$platform/bin/"
            mkdir -p "../build/$platform/bin"
            mv "$artifact"/* "../build/$platform/bin/"
          done
          popd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Reads package.json's engines.node, the one already-checked-in source of truth - no
          # separate Actions variable to keep in sync with it.
          node-version-file: "package.json"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The release tag (vX.Y.Z) is the version everything is published at, so
      # the npm package version must match it. This runs the `version` lifecycle
      # script (build + update-optional-deps), keeping optionalDependencies
      # pinned to the same version. --allow-same-version makes re-runs safe.
      #
      # update-optional-deps keeps its own build prefix (see package.json): this is where dist/
      # is compiled in this job, and the two steps below both read it.
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Setting npm package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Prepare platform packages with binaries
        run: |
          node scripts/create-platform-packages.js --all

      # Checks what npm pack would actually ship, not the working tree: refuses any platform package
      # whose binaries are absent or missing a required symbol.
      - name: Verify package
        run: npm run verify-package

      # npm 11 refuses to publish a prerelease with no --tag, and `latest` is only ever the stable line, so
      # the dist-tag is the version's prerelease identifier or latest, never a guess.
      - name: Derive the dist-tag from the version
        id: dist
        run: |
          node -e '
            const { version } = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            const identifier = version.split("-")[1]?.split(".")[0];
            if (identifier !== undefined && !/^[a-zA-Z][a-zA-Z0-9-]*$/.test(identifier)) {
              console.log(`::error::Version ${version} has the prerelease identifier "${identifier}". A dist-tag cannot start with a digit, because npm would read it as a version. Name the prerelease (7.82.1-next.0), then re-tag.`);
              process.exit(1);
            }
            const tag = identifier ?? "latest";
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            console.log(`Publishing ${version} under the ${tag} dist-tag.`);
          '

      - name: Publish platform packages
        run: |
          for platform_dir in npm/*/; do
            platform=$(basename "$platform_dir")
            echo "Publishing platform package: $platform"

            cd "$platform_dir"

            # Check if binaries exist
            if [ -d "bin" ] && [ "$(ls -A bin)" ]; then
              npm publish --access public --tag "$DIST_TAG"
              echo "Published @deliciousmonster/datadog-agent-binary-$platform"
            else
              echo "Skipping $platform - no binaries found"
            fi

            cd - > /dev/null
          done
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}

      - name: Publish main package
        run: npm publish --access public --tag '${{ steps.dist.outputs.tag }}'
