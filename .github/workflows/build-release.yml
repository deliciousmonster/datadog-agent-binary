name: Build and Release Datadog Agent Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      datadog_version:
        description: "Datadog Agent version to build"
        required: false
      agent_build_args:
        description: "Override args for `dda inv agent.build` (e.g. to build a self-contained, Python-free binary). Leave blank for default."
        required: false

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.23"

jobs:
  build:
    # Legs flagged `experimental` are allowed to fail so they don't block
    # `release`/`publish`, which depend on this job. The publish step skips any
    # platform whose binary is missing.
    continue-on-error: ${{ matrix.experimental || false }}
    # Cap each leg so a runner that never gets scheduled (e.g. a retired runner
    # image) can't stall the whole build — and therefore the publish — for the
    # default 6h. A real agent build finishes well within this.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          #
          # glibc floor: the agent binary links against whatever glibc the
          # build runner ships, and glibc is backward-compatible only upward
          # (a binary built on an older glibc runs on newer ones, not vice
          # versa). The Harper Pro runtime image is Debian 12 (glibc 2.36), so
          # we must build on a runner whose glibc is <= 2.36 or the binary
          # won't load there (it would reference GLIBC_2.38/2.39 symbols that
          # don't exist on the image). ubuntu-latest is now Ubuntu 24.04
          # (glibc 2.39), so we pin to ubuntu-22.04 (glibc 2.35). The agent
          # does not actually require any newer glibc feature; upstream
          # Datadog builds against an even older glibc for portability.
          - os: ubuntu-22.04
            platform: linux-x86_64
          # GitHub-hosted arm64 runner on Ubuntu 22.04 (glibc 2.35), the arm
          # counterpart of the x86_64 pin above. If hosted arm runners aren't
          # available, swap this for any arm runner whose glibc is <= 2.36;
          # the "Verify glibc floor" step below will fail the build if it
          # isn't.
          - os: ubuntu-22.04-arm
            platform: linux-arm64

          # macOS builds
          # macOS x86_64 (Intel) is omitted: GitHub has retired the macos-13
          # Intel runner, so it can't be built on hosted runners. Re-add it with
          # a self-hosted or cross-compiling runner if Intel-mac support is
          # needed again.
          - os: macos-latest
            platform: macos-arm64

          # Windows builds
          - os: windows-latest
            platform: windows-x86_64
          # Disable Windows ARM64 builds until Chocolatey supports it
          # - os: windows-11-arm
          #   platform: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The dispatch input reaches bash as an environment value, never as source. Spliced through
      # ${{ }} it is shell text, and `7.0.0 ; touch pwned ; #` executes on the runner.
      - name: Extract version from tag
        id: extract_version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.datadog_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.platform }}
        shell: bash
        env:
          DEBUG: true
          DD_AGENT_BUILD_ARGS: ${{ github.event.inputs.agent_build_args }}
          # Carries the dispatch input back out of the step above, so it stays a value here too.
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args=(--datadog-version "$VERSION"); fi
          node dist/cli.js build "${args[@]}"
          ls -l "build/${{ matrix.platform }}/bin/"

      # Prove the binary actually runs as a standalone file BEFORE we ship it.
      # We hide the build tree first so a binary that still links libraries by
      # their build-time path (e.g. librtloader) can't be satisfied — that's the
      # exact failure that only shows up on a user's machine. A self-contained
      # binary runs fine; a non-relocatable one fails here and blocks the
      # release instead of publishing something that won't start.
      - name: Smoke test ${{ matrix.platform }} runs standalone (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          bin="build/${{ matrix.platform }}/bin/datadog-agent"
          src="build/${{ matrix.platform }}/src"
          [ -d "$src" ] && mv "$src" "${src}.hidden" || true
          echo "Running: $bin version (build tree hidden)"
          "$bin" version
          [ -d "${src}.hidden" ] && mv "${src}.hidden" "$src" || true

      # Guard against the symbol floor creeping back up. The Harper Pro runtime
      # image (Debian 12) provides glibc 2.36 (libc.so.6) AND libstdc++
      # GLIBCXX_3.4.30 (from GCC 12). These are two SEPARATE libraries: the
      # glibc floor is set by the runner's Ubuntu version, the GLIBCXX floor by
      # its GCC version. The agent binary must not reference a symbol newer than
      # either, or it fails to load on the image with "version `GLIBC_2.xx' not
      # found" or "version `GLIBCXX_3.4.xx' not found" — the latter is the exact
      # error the Macy's deploy hit on rocksdb-js. Building on ubuntu-22.04
      # (glibc 2.35, GCC 11 -> GLIBCXX_3.4.29) keeps both under the limit. This
      # step fails the build loudly if either floor is exceeded, so we catch it
      # in CI instead of on a customer's instance.
      - name: Verify glibc / libstdc++ floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          bin="build/${{ matrix.platform }}/bin/datadog-agent"

          check() {
            label="$1"; prefix="$2"; limit="$3"
            # GLIBC_ won't match GLIBCXX_ (char after GLIBC is X, not _), so the
            # two families are counted independently.
            max=$(strings -a "$bin" | grep -o "${prefix}_[0-9.]\+" | sed "s/${prefix}_//" | sort -uV | tail -1)
            echo "${label}: binary references up to ${prefix}_${max:-<none>}; image provides ${prefix}_${limit}"
            if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$limit" "$max" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::Binary requires ${prefix}_${max} but the Harper Pro runtime image only provides ${prefix}_${limit}. Build on an older toolchain (glibc <= 2.36, GCC <= 12) so the agent loads on the image."
              return 1
            fi
            return 0
          }

          rc=0
          check "glibc"     "GLIBC"    "2.36"   || rc=1
          check "libstdc++" "GLIBCXX"  "3.4.30" || rc=1
          if [ "$rc" -eq 0 ]; then
            echo "OK: binary stays within the Harper Pro image's glibc and libstdc++ versions."
          fi
          exit "$rc"

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/bin/
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Git permits ; $() ` && and | in a tag name, so ref_name spliced into a run body is shell
      # source. It arrives as a value, like every other untrusted input in this workflow.
      - name: Prepare release assets
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets

          # Create compressed archives for each platform
          cd artifacts

          echo "Recursively listing files in artifacts:"
          ls -lR

          # Linux platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-linux-${arch}" ]; then
              cd "agent-linux-${arch}"
              tar -czf "../../release-assets/datadog-agent-${REF_NAME}-linux-${arch}.tar.gz" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

          # macOS platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-macos-${arch}" ]; then
              cd "agent-macos-${arch}"
              tar -czf "../../release-assets/datadog-agent-${REF_NAME}-macos-${arch}.tar.gz" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

          # Windows platforms
          for arch in x86_64 arm64; do
            if [ -d "agent-windows-${arch}" ]; then
              cd "agent-windows-${arch}"
              zip -r "../../release-assets/datadog-agent-${REF_NAME}-windows-${arch}.zip" *
              cd ..
            fi
          done

          echo "Listing files in release-assets:"
          ls -l ../release-assets

      - name: Generate checksums
        run: |
          echo "Listing current dir"
          ls -l
          echo "Listing release-assets dir"
          ls -l release-assets/
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Datadog Agent ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
          body: |
            # @harperfast/datadog-agent-binary ${{ github.ref_name }}

            Pre-compiled Datadog Agent binaries for all supported platforms.

            ## Supported Platforms

            - **Linux x86_64**: `datadog-agent-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - **Linux arm64**: `datadog-agent-${{ github.ref_name }}-linux-arm64.tar.gz`
            - **macOS x86_64**: `datadog-agent-${{ github.ref_name }}-macos-x86_64.tar.gz`
            - **macOS arm64**: `datadog-agent-${{ github.ref_name }}-macos-arm64.tar.gz`
            - **Windows x86_64**: `datadog-agent-${{ github.ref_name }}-windows-x86_64.zip`

            ## NPM Package

            ```bash
            npm install @harperfast/datadog-agent-binary
            ```

            ## Verification

            ```bash
            sha256sum -c checksums.txt
            ```

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List binaries
        run: |
          echo "Listing artifacts dir"
          ls -l artifacts/
          echo "Listing artifacts subdirs"
          ls -l artifacts/*

      - name: Move binaries to build dirs
        run: |
          echo "Listing artifacts dir again"
          ls -l artifacts/
          pushd artifacts
          for artifact in *
          do
            platform=${artifact#agent-}
            echo "Moving contents of $artifact into ../build/$platform/bin/"
            ls -l "$artifact"
            mkdir -p "../build/$platform/bin"
            mv "$artifact"/* "../build/$platform/bin/"
          done
          popd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The release tag (vX.Y.Z) is the version everything is published at, so
      # the npm package version must match it. This runs the `version` lifecycle
      # script (build + update-optional-deps), keeping optionalDependencies
      # pinned to the same version. --allow-same-version makes re-runs safe.
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting npm package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Prepare platform packages with binaries
        run: |
          node scripts/create-platform-packages.js --all

      - name: Publish platform packages
        run: |
          for platform_dir in npm/*/; do
            platform=$(basename "$platform_dir")
            echo "Publishing platform package: $platform"

            cd "$platform_dir"

            # Check if binaries exist
            if [ -d "bin" ] && [ "$(ls -A bin)" ]; then
              npm publish --access public
              echo "Published @harperfast/datadog-agent-binary-$platform"
            else
              echo "Skipping $platform - no binaries found"
            fi

            cd - > /dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
