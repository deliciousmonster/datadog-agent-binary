name: Build and Release Datadog Agent Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      datadog_version:
        description: 'Datadog Agent version to build'
        required: false
      agent_build_args:
        description: 'Override args for `dda inv agent.build` (e.g. to build a self-contained, Python-free binary). Leave blank for default.'
        required: false
      trace_agent_build_args:
        description: 'Override args for `dda inv trace-agent.build`. Leave blank for default (the trace-agent needs no build excludes).'
        required: false

env:
  # Must satisfy the go.mod `go` directive of the agent release pinned in
  # .datadog-agent-version. Bump it when the pin moves across a Go minor;
  # ensureGoVersion() in src/builder.ts refuses a mismatched build, since setup-go
  # runs before the source is cloned and cannot read its .go-version.
  GO_VERSION: '1.26.5'
  # The Datadog Agent version this package BUNDLES is NOT set here. It lives in
  # .datadog-agent-version, which src/downloader.ts reads when no --datadog-version
  # is passed. It used to be duplicated here, and two copies of a pin are two pins:
  # the workflow builds one release while the repo claims another, and nothing
  # compares them. The workflow_dispatch `datadog_version` input still overrides it
  # for one-off builds.

jobs:
  # Gate. test.yml runs on `push: branches: ["**"]`, which matches branches only, so
  # a tag push does not trigger it. Without this job, cutting a release ran zero
  # tests against the ref being published: tagging a green commit is the common case
  # but nothing enforced it.
  #
  # This asserts the commit already has a green Test run rather than running a suite
  # of its own. Re-running one ubuntu leg here was strictly weaker than what the
  # branch already got: test.yml runs eight legs, six unit legs across ubuntu, macOS
  # and Windows on Node 22 and 24 plus two real-Harper integration legs, so a
  # Windows-only failure passed this gate and shipped. Asserting is also seconds
  # instead of minutes, because it needs neither a checkout nor an npm ci.
  #
  # prerelease.yml runs the same check before it cuts a tag, as two similar steps
  # rather than one shared composite action: an action has to be checked out before
  # it can be used, and the checkout is the cost this job just removed. Drift
  # between the two fails closed on both sides, because a query that stops
  # returning a run never reaches the success branch.
  tested:
    name: require a green Test run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading workflow runs. Spelled out because this workflow declares no
      # top-level permissions, so the job would otherwise take the repo default.
      actions: read
    steps:
      # Fail closed when no Test run exists for the commit. A tag can point at any
      # commit at all, and one that never ran the suite is precisely what must not
      # ship; test.yml has workflow_dispatch to arm an old commit by hand.
      #
      # "Absent" is also what a tag pushed seconds after a merge sees, because the
      # Test run that merge started may not be created yet, so absence has to wait
      # out the same ceiling as a run still in flight rather than fail immediately.
      - name: Require a green Test run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 60 * 30s = 30 minutes, matching prerelease.yml. The Test matrix plus the
          # integration legs finish well inside that; past it something is wedged and
          # a human should look before a release does.
          for i in $(seq 1 60); do
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "absent absent -" else "\(.status) \(.conclusion) \(.html_url)" end')
            read -r STATUS CONCLUSION URL <<<"$RUN"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Test succeeded for ${GITHUB_SHA}: ${URL}"
                exit 0
              fi
              echo "::error::Test concluded '${CONCLUSION}' for ${GITHUB_SHA} (${URL}); refusing to build a release. Fix the commit and tag the fix, or re-run Test until it is green."
              exit 1
            fi
            echo "Test is ${STATUS} for ${GITHUB_SHA}; waiting... ($i/60)"
            sleep 30
          done
          echo "::error::No completed Test run for ${GITHUB_SHA} within 30 minutes; refusing to build a release. If this commit was never pushed to a branch, run test.yml against it with workflow_dispatch first."
          exit 1

  # The same preflight prerelease.yml runs before cutting a tag, repeated here
  # because a hand-pushed tag or a dispatch on a tag ref skips that workflow
  # entirely. Catches a dead publish path (bad npm auth, provenance repository
  # mismatch) in seconds instead of after every platform's Go build. Always runs
  # and no-ops on non-tag refs: an `if:` would skip the job, and a skipped job
  # in `needs` skips everything downstream of it.
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Check the publish path before building
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*) node scripts/release-preflight.js ;;
            *) echo "Not a tag ref: publish will not run, nothing to check." ;;
          esac

  build:
    needs: [tested, preflight]
    # Cap each leg so a runner that never gets scheduled (e.g. a retired runner
    # image) can't stall the build, and therefore the publish, for the default 6h.
    # A real agent build finishes well within this.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc floor. Both shipped binaries link against whatever glibc the
          # build runner ships, and glibc only works upward: a binary built on an
          # older glibc runs on newer ones, not the reverse. The trace-agent is no
          # exception, its build tags include netcgo so it is dynamically linked
          # exactly like the core agent.
          #
          # The oldest runtime we load on is the OSS Harper image, still Debian 12
          # / glibc 2.36 (harper-pro has moved to node:24-trixie, glibc 2.41, so it
          # no longer sets the floor). ubuntu-latest is Ubuntu 24.04, glibc 2.39,
          # and would emit GLIBC_2.38/2.39 references the image cannot satisfy, so
          # pin ubuntu-22.04 (glibc 2.35). The agent needs no newer glibc feature.
          - os: ubuntu-22.04
            platform: linux-x86_64
          # The arm counterpart, also Ubuntu 22.04. Any arm runner with glibc
          # <= 2.36 works; "Verify glibc floor" below fails the build if it isn't.
          - os: ubuntu-22.04-arm
            platform: linux-arm64

          # macOS x86_64 (Intel) is omitted: GitHub retired the macos-13 Intel
          # runner. Re-add it with a self-hosted or cross-compiling runner if
          # Intel-mac support is needed again.
          - os: macos-latest
            platform: macos-arm64

          - os: windows-latest
            platform: windows-x86_64
          # windows-arm64 is omitted until Chocolatey supports it.

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The agent version BUILT is independent of the package release version: the
      # git tag only drives the npm package version, set in the publish job.
      # Without a workflow_dispatch override the build passes no --datadog-version
      # and src/downloader.ts falls back to .datadog-agent-version, the one place
      # the bundled release is recorded. Echoed so the build log states which
      # upstream release this artifact came from even on the default path.
      - name: Show the pinned Datadog Agent version
        shell: bash
        run: cat .datadog-agent-version

      # Permanent, not a debugging leftover. A build that runs out of disk fails deep
      # inside bazel analysis as an extraction IOException on a repository fetch,
      # which reads like a toolchain fault. These numbers are what tell the two apart.
      # Keep in step with build-verify.yml.
      - name: Report free disk space (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: df -h

      - name: Report free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{ n = 'Used(GB)'; e = { [math]::Round($_.Used / 1GB, 1) } },
              @{ n = 'Free(GB)'; e = { [math]::Round($_.Free / 1GB, 1) } },
              Root |
            Format-Table -AutoSize

      # Measured on ubuntu-22.04: the root volume is 73 GiB with 12 GiB free when the
      # build starts, there is no second volume to move to, and none of the paths
      # below is loaded by this build. Removing them takes ~2 minutes of rm and
      # returns ~18 GiB.
      - name: Reclaim disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          avail() { df --output=avail -k / | tail -1; }
          before="$(avail)"
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            [ -e "$path" ] || continue
            sudo rm -rf "$path" || echo "could not remove $path, continuing"
          done
          after="$(avail)"
          echo "Reclaimed $(( (after - before) / 1024 )) MiB on /"
          df -h /

      # One build step produces BOTH binaries: src/builder.ts iterates
      # platform.getBinaries() and runs `dda inv <buildTask>` per descriptor. Each
      # descriptor names its own override env var, so core and trace-agent flags
      # cannot be aimed at the wrong target.
      #
      # The flag is assembled by the Actions expression rather than by a shell
      # conditional, so one line runs under bash and pwsh alike and the Windows leg
      # keeps the default shell upstream's bazel guide asks for. Keeping it
      # conditional is load-bearing: resolveVersion() in src/downloader.ts uses `??`,
      # which does not catch '', so an unconditional `--datadog-version ''` reaches
      # assertRefExists('') and 404s the default path.
      - name: Build ${{ matrix.platform }}
        env:
          DEBUG: true
          DD_AGENT_BUILD_ARGS: ${{ github.event.inputs.agent_build_args }}
          DD_TRACE_AGENT_BUILD_ARGS: ${{ github.event.inputs.trace_agent_build_args }}
        run: node dist/cli.js build ${{ github.event.inputs.datadog_version && format('--datadog-version ''{0}''', github.event.inputs.datadog_version) || '' }}

      # Prove every binary we ship runs as a standalone file BEFORE we ship it. The
      # build tree is hidden first so a binary that still links a library by its
      # build-time path (e.g. librtloader) cannot be satisfied; that failure
      # otherwise shows up only on a user's machine.
      #
      # The loop over BOTH binaries is load-bearing. The package once shipped with
      # the core agent only: nothing bound 127.0.0.1:8126, dd-trace got
      # ECONNREFUSED, and every span was dropped in silence.
      - name: Smoke test ${{ matrix.platform }} binaries run standalone (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bindir="build/${{ matrix.platform }}/bin"
          src="build/${{ matrix.platform }}/src"
          [ -d "$src" ] && mv "$src" "${src}.hidden" || true

          rc=0
          for name in datadog-agent trace-agent; do
            bin="$bindir/$name"
            if [ ! -x "$bin" ]; then
              echo "::error::$bin was not built. Both the core agent and the trace-agent must ship; without trace-agent nothing listens on 8126 and every span is dropped silently."
              rc=1
              continue
            fi
            echo "Running: $bin version (build tree hidden)"
            "$bin" version || { echo "::error::$bin failed to run standalone."; rc=1; }
          done

          [ -d "${src}.hidden" ] && mv "${src}.hidden" "$src" || true
          exit "$rc"

      # The Windows counterpart. Without it the .exe path through descriptors ->
      # build -> copy -> package -> resolve is compiled and never once executed.
      - name: Smoke test ${{ matrix.platform }} binaries run standalone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bindir = "build/${{ matrix.platform }}/bin"
          $src    = "build/${{ matrix.platform }}/src"
          $hidden = "$src.hidden"
          if (Test-Path $src) { Move-Item $src $hidden }

          $rc = 0
          foreach ($name in @('datadog-agent.exe', 'trace-agent.exe')) {
            $bin = Join-Path $bindir $name
            if (-not (Test-Path $bin)) {
              Write-Output "::error::$bin was not built. Both the core agent and the trace-agent must ship; without trace-agent nothing listens on 8126 and every span is dropped silently."
              $rc = 1
              continue
            }
            Write-Output "Running: $bin version (build tree hidden)"
            & $bin version
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::$bin failed to run standalone (exit $LASTEXITCODE)."
              $rc = 1
            }
          }

          if (Test-Path $hidden) { Move-Item $hidden $src }
          exit $rc

      # Symbol-level proof that the trace binary is a trace-agent and not a second
      # copy of the core agent. `version` cannot tell those apart: a misdispatched
      # binary prints a version and exits 0 with no receiver in it. pkg/trace/api
      # is the package that binds the port.
      #
      # One step covers all four legs. Go writes each function's full package path
      # into the binary the same way for ELF, Mach-O and PE, so a byte scan reads
      # every format and needs no `strings` on PATH. On the 7.82.1 build: 804 hits
      # in the macos-arm64 trace-agent, 1330 in trace-agent.exe, and 0 in either
      # core agent.
      #
      # The same step runs in build-release.yml and build-verify.yml, byte for
      # byte. Drift between those two files is a defect class this repo keeps
      # hitting, so change both or neither.
      - name: Assert the trace binary contains the APM receiver
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");
            const { Platform } = require("./dist/platform.js");

            // Scan raw bytes, never decoded text. The needle is ASCII, so latin1
            // encodes it one byte per character and Buffer.indexOf compares against
            // the file exactly as Go wrote it; decoding a binary to a string first
            // is what would lose a match to a replacement character.
            const count = (buf, needle) => {
              const pin = Buffer.from(needle, "latin1");
              let n = 0;
              for (let i = buf.indexOf(pin); i !== -1; i = buf.indexOf(pin, i + pin.length)) n++;
              return n;
            };

            const platform = Platform.current();
            const binary = (kind) => `build/${platform.getName()}/bin/${platform.getBinary(kind).outputName}`;
            const receiver = "datadog-agent/pkg/trace/api.";
            const entry = "datadog-agent/cmd/trace-agent";

            const tracePath = binary("trace");
            const corePath = binary("core");
            const traceReceiver = count(readFileSync(tracePath), receiver);
            const traceEntry = count(readFileSync(tracePath), entry);
            const coreReceiver = count(readFileSync(corePath), receiver);

            console.log(`pkg/trace/api   in ${tracePath} : ${traceReceiver}`);
            console.log(`cmd/trace-agent in ${tracePath} : ${traceEntry}`);
            console.log(`pkg/trace/api   in ${corePath} : ${coreReceiver}  (expected 0)`);

            if (traceReceiver === 0) {
              console.log(`::error::${tracePath} contains no pkg/trace/api symbols; it cannot serve the receiver.`);
              process.exitCode = 1;
            }
            if (traceEntry === 0) {
              console.log(`::error::${tracePath} contains no cmd/trace-agent symbols.`);
              process.exitCode = 1;
            }
            // Zero in the core agent is what makes the counts above evidence rather
            // than noise: the same scan finds nothing in a Go binary with no receiver
            // in it. A nonzero count means the two binaries stopped being distinct,
            // either because one was copied over the other or because upstream linked
            // the receiver into the core agent.
            if (coreReceiver !== 0) {
              console.log(`::error::${corePath} contains ${coreReceiver} pkg/trace/api symbols, expected 0.`);
              process.exitCode = 1;
            }
          '

      # `version` only proves the file loads. This starts the trace-agent, waits
      # for it to bind 127.0.0.1:8126, and submits a trace payload the way dd-trace
      # does. The original defect shipped a package where nothing ever listened on
      # 8126 and every "is the file there" check passed anyway.
      #
      # The trace-agent dies at startup unless datadog.yaml EXISTS (0 bytes is
      # enough, every setting below arrives through the environment) and its config
      # and run directories are writable, so the whole run lives in one temp dir.
      # Nothing leaves the runner: the hostname is pinned so no cloud metadata is
      # probed, remote config is off, and the trace writer points at a dead local
      # port, so payloads are accepted by the receiver and then fail to forward.
      #
      # Every Unix leg, not just Linux. Proving the receiver on one published
      # platform leaves the rest resting on "the file exists". Checked by hand on
      # darwin/arm64 first.
      - name: Verify APM receiver accepts traces (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/build/${{ matrix.platform }}/bin/trace-agent"
          work="$(mktemp -d)"
          pid=""

          dump_logs() {
            echo "--- trace-agent console ---"
            cat "$work/console.log" 2>/dev/null || echo "(none)"
            echo "--- trace-agent log file ---"
            cat "$work/trace-agent.log" 2>/dev/null || echo "(none)"
          }
          cleanup() {
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          mkdir -p "$work/conf.d" "$work/run"
          : > "$work/datadog.yaml"

          export DD_API_KEY=dummy
          export DD_HOSTNAME=ci-apm-smoke
          export DD_CONFD_PATH="$work/conf.d"
          export DD_RUN_PATH="$work/run"
          export DD_AUTH_TOKEN_FILE_PATH="$work/auth_token"
          export DD_IPC_CERT_FILE_PATH="$work/ipc_cert.pem"
          export DD_LOG_FILE="$work/trace-agent.log"
          export DD_BIND_HOST=127.0.0.1
          export DD_APM_ENABLED=true
          export DD_APM_RECEIVER_PORT=8126
          export DD_REMOTE_CONFIGURATION_ENABLED=false
          export DD_APM_DD_URL=http://127.0.0.1:1

          "$bin" run -c "$work/datadog.yaml" > "$work/console.log" 2>&1 &
          pid=$!
          echo "trace-agent running as pid $pid out of $work"

          # 60 * 0.5s = 30s ceiling, but bail the moment the process dies so a
          # startup failure reports in a second instead of after the timeout.
          ready=0
          for _ in $(seq 1 60); do
            # No -S: connection refused until the listener is up is expected, and
            # printing it 60 times buries the real failure when there is one.
            if curl -fs --max-time 2 http://127.0.0.1:8126/info -o "$work/info.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::trace-agent exited before it bound 127.0.0.1:8126."
              dump_logs
              exit 1
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::trace-agent never answered http://127.0.0.1:8126/info within 30s."
            dump_logs
            exit 1
          fi

          echo "--- /info ---"
          cat "$work/info.json"
          echo

          # Parse the JSON rather than grep it: the claim is that the receiver
          # ADVERTISES the endpoint dd-trace posts to, not that the string appears
          # somewhere in the response.
          python3 - "$work/info.json" <<'PY'
          import json, sys

          with open(sys.argv[1]) as fh:
              info = json.load(fh)
          endpoints = info.get("endpoints") or []
          if "/v0.4/traces" not in endpoints:
              print(f"::error::/info does not advertise /v0.4/traces (endpoints: {endpoints})")
              sys.exit(1)
          print(f"/info advertises /v0.4/traces (trace-agent version {info.get('version')})")
          PY

          # A real single-span v0.4 payload: array of traces, each an array of
          # spans. An empty array is accepted by a receiver that never decodes a
          # span, so it proves nothing the open port had not already proven.
          payload='[[{"trace_id":1,"span_id":2,"name":"ci.smoke","resource":"ci","service":"build-release","type":"custom","start":1,"duration":1000000}]]'
          code=$(curl -sS -o "$work/put.out" -w '%{http_code}' --max-time 10 \
            -X PUT -H 'Content-Type: application/json' --data "$payload" \
            http://127.0.0.1:8126/v0.4/traces)
          echo "PUT /v0.4/traces -> HTTP $code, body: $(cat "$work/put.out")"
          if [ "$code" != "200" ]; then
            echo "::error::PUT /v0.4/traces returned HTTP $code, expected 200."
            dump_logs
            exit 1
          fi

          echo "OK: trace-agent bound 127.0.0.1:8126, advertised /v0.4/traces, and accepted a span."

      # windows-x86_64 shipped a trace-agent.exe nothing had ever asked for a span.
      # Keep this in step with the copy in build-verify.yml; the only deliberate
      # differences are where the binary path comes from and the hostname each
      # workflow tags its run with.
      - name: Verify APM receiver accepts traces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A refused connection is the expected state until the listener is up. If
          # PowerShell ever makes a native command's exit code terminating, the
          # retry loop below turns into a hard failure on its first iteration.
          $PSNativeCommandUseErrorActionPreference = $false

          $bin = Join-Path $PWD "build/${{ matrix.platform }}/bin/trace-agent.exe"
          $work = Join-Path $env:RUNNER_TEMP 'apm-receiver-check'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$work\conf.d", "$work\run" | Out-Null
          # Contents are irrelevant to startup; existence is not. Without this the
          # process exits immediately with "unable to load Datadog config file".
          New-Item -ItemType File -Force -Path "$work\datadog.yaml" | Out-Null

          $env:DD_API_KEY = 'dummy'
          $env:DD_HOSTNAME = 'ci-apm-smoke'
          $env:DD_CONFD_PATH = "$work\conf.d"
          $env:DD_RUN_PATH = "$work\run"
          $env:DD_AUTH_TOKEN_FILE_PATH = "$work\auth_token"
          $env:DD_IPC_CERT_FILE_PATH = "$work\ipc_cert.pem"
          $env:DD_LOG_FILE = "$work\trace-agent.log"
          $env:DD_BIND_HOST = '127.0.0.1'
          $env:DD_APM_ENABLED = 'true'
          $env:DD_APM_RECEIVER_PORT = '8126'
          $env:DD_REMOTE_CONFIGURATION_ENABLED = 'false'
          # Dead local port: the receiver accepts payloads and then fails to
          # forward them, keeping the run entirely on the runner.
          $env:DD_APM_DD_URL = 'http://127.0.0.1:1'

          $out = "$work\console.out.log"
          $err = "$work\console.err.log"
          $proc = $null
          $rc = 0

          try {
            # --foreground because `run` hands itself to the Windows service control
            # manager whenever servicemain.RunningAsWindowsService() says yes, and a
            # CI step is the wrong place to discover that detection was wrong.
            $proc = Start-Process -FilePath $bin -ArgumentList 'run', '--foreground', '-c', "$work\datadog.yaml" `
              -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            Write-Output "trace-agent running as pid $($proc.Id) out of $work"

            # 60 * 0.5s = 30s ceiling, but bail the moment the process dies so a
            # startup failure reports in a second instead of after the timeout.
            # curl.exe rather than Invoke-WebRequest: it reports a refused
            # connection and a non-2xx as exit codes, where Invoke-WebRequest throws
            # and every branch below would need a try/catch to read a status line.
            $ready = $false
            foreach ($attempt in 1..60) {
              curl.exe -fs --max-time 2 http://127.0.0.1:8126/info -o "$work\info.json"
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
              if ($proc.HasExited) {
                throw "trace-agent exited with code $($proc.ExitCode) before it bound 127.0.0.1:8126."
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw 'trace-agent never answered http://127.0.0.1:8126/info within 30s.'
            }

            Write-Output '--- /info ---'
            $info = Get-Content -Raw "$work\info.json"
            Write-Output $info
            # Parse rather than match: the claim is that the receiver ADVERTISES the
            # endpoint dd-trace posts to, not that the string is somewhere in the body.
            $endpoints = ($info | ConvertFrom-Json).endpoints
            if ($endpoints -notcontains '/v0.4/traces') {
              throw "/info does not advertise /v0.4/traces (endpoints: $($endpoints -join ', '))"
            }

            # A real single-span v0.4 payload: array of traces, each an array of
            # spans. Sent from a file so PowerShell's native-argument quoting never
            # sees the JSON.
            $payload = '[[{"trace_id":1,"span_id":2,"name":"ci.smoke","resource":"ci","service":"build-release","type":"custom","start":1,"duration":1000000}]]'
            Set-Content -Path "$work\payload.json" -Value $payload -Encoding ascii -NoNewline
            $code = curl.exe -sS -o "$work\put.out" -w '%{http_code}' --max-time 10 `
              -X PUT -H 'Content-Type: application/json' --data "@$work\payload.json" `
              http://127.0.0.1:8126/v0.4/traces
            Write-Output "PUT /v0.4/traces -> HTTP $code, body: $(Get-Content -Raw "$work\put.out")"
            if ("$code" -ne '200') {
              throw "PUT /v0.4/traces returned HTTP $code, expected 200."
            }

            Write-Output 'OK: trace-agent.exe bound 127.0.0.1:8126, advertised /v0.4/traces, and accepted a span.'
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            Write-Output '--- trace-agent stdout ---'
            Get-Content -Raw $out -ErrorAction SilentlyContinue
            Write-Output '--- trace-agent stderr ---'
            Get-Content -Raw $err -ErrorAction SilentlyContinue
            Write-Output '--- trace-agent log file ---'
            Get-Content -Raw "$work\trace-agent.log" -ErrorAction SilentlyContinue
            $rc = 1
          } finally {
            # A trace-agent left running holds the job open until the 60 minute cap.
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          }

          exit $rc

      # Guard against the symbol floor creeping back up, for EVERY binary we ship.
      # The trace-agent carries the netcgo build tag, so it is dynamically linked
      # against glibc just like the core agent; checking datadog-agent alone would
      # let through a trace-agent that cannot load on the image. The floor is 2.36
      # because the OSS Harper image is Debian 12.
      #
      # glibc and libstdc++ are SEPARATE libraries: the glibc floor comes from the
      # runner's Ubuntu version, the GLIBCXX floor from its GCC version. A binary
      # referencing a symbol newer than either fails to load with "version
      # `GLIBC_2.xx' not found" or "version `GLIBCXX_3.4.xx' not found" - the
      # latter is what the Macy's deploy hit on rocksdb-js. ubuntu-22.04 (glibc
      # 2.35, GCC 11 -> GLIBCXX_3.4.29) keeps both under the limit.
      - name: Verify glibc / libstdc++ floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          check() {
            local binpath="$1" label="$2" prefix="$3" limit="$4" max
            # GLIBC_ won't match GLIBCXX_ (char after GLIBC is X, not _), so the
            # two families are counted independently.
            max=$(strings -a "$binpath" | grep -o "${prefix}_[0-9.]\+" | sed "s/${prefix}_//" | sort -uV | tail -1)
            echo "$(basename "$binpath") ${label}: references up to ${prefix}_${max:-<none>}; image provides ${prefix}_${limit}"
            if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$limit" "$max" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::$(basename "$binpath") requires ${prefix}_${max} but the oldest Harper runtime image only provides ${prefix}_${limit}. Build on an older toolchain (glibc <= 2.36, GCC <= 12) so it loads on the image."
              return 1
            fi
            return 0
          }

          bindir="build/${{ matrix.platform }}/bin"
          rc=0
          for name in datadog-agent trace-agent; do
            bin="$bindir/$name"
            if [ ! -f "$bin" ]; then
              echo "::error::$bin is missing, so its symbol floor was never checked."
              rc=1
              continue
            fi
            check "$bin" "glibc"     "GLIBC"    "2.36"   || rc=1
            check "$bin" "libstdc++" "GLIBCXX"  "3.4.30" || rc=1
          done
          if [ "$rc" -eq 0 ]; then
            echo "OK: every shipped binary stays within the oldest Harper image's glibc and libstdc++ versions."
          fi
          exit "$rc"

      # The artifact is the whole bin/ directory, which is how both binaries travel
      # to the publish job. A half-empty bin/ uploads without complaint and only
      # surfaces as a missing trace-agent at install time.
      - name: Verify both binaries are present for upload
        shell: bash
        run: |
          bindir="build/${{ matrix.platform }}/bin"
          ext=""
          if [ "${RUNNER_OS:-}" = "Windows" ]; then ext=".exe"; fi
          ls -l "$bindir"
          rc=0
          for name in datadog-agent trace-agent; do
            if [ ! -f "$bindir/${name}${ext}" ]; then
              echo "::error::$bindir/${name}${ext} is missing; the ${{ matrix.platform }} artifact would ship incomplete."
              rc=1
            fi
          done
          exit "$rc"

      # Uploading the directory rather than a single file is what carries the core
      # agent AND the trace-agent. if-no-files-found: error stops a build that
      # produced nothing from uploading an empty artifact.
      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/bin/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). With a trusted publisher
      # configured on npmjs.com for this repo + workflow, `npm publish` mints a
      # short-lived token from this ID token, so no NPM_TOKEN secret is needed. It
      # also attaches build provenance recording which commit produced each tarball.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Move binaries to build dirs
        run: |
          pushd artifacts
          for artifact in *
          do
            platform=${artifact#agent-}
            echo "Moving contents of $artifact into ../build/$platform/bin/"
            ls -l "$artifact"
            mkdir -p "../build/$platform/bin"
            mv "$artifact"/* "../build/$platform/bin/"
          done
          popd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, newer than the npm bundled with
      # Node 22. Upgrade the CLI, not the runtime: bumping Node here would change the
      # interpreter the build ran under.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build TypeScript
        run: npm run build

      # The release tag (vX.Y.Z) is the version everything publishes at, so the npm
      # package version must match it. This runs the `version` lifecycle script
      # (build + update-optional-deps), keeping optionalDependencies pinned to the
      # same version. --allow-same-version makes re-runs safe.
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting npm package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # A prerelease publishes under `next` so it cannot move `latest`; a stable
      # release publishes under `latest`.
      #
      # Decided by parsing semver rather than looking for a hyphen. The two agree for
      # `7.75.6-next.0`, but "contains a hyphen" is not what prerelease means, and this
      # switch decides whether an untested build becomes the default install for every
      # consumer.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG=$(node -e '
            const v = process.argv[1];
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(v);
            if (!m) {
              console.error(`::error::Tag "${v}" is not valid semver; refusing to publish.`);
              process.exit(1);
            }
            process.stdout.write(m[4] ? "next" : "latest");
          ' "$VERSION")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under npm dist-tag: $TAG"

      # Two auth paths, chosen by whether the secret exists:
      #
      #   Trusted Publishing (preferred): configure a trusted publisher on npmjs.com
      #     for this repo and workflow, leave NPM_TOKEN unset, and npm exchanges the
      #     OIDC token above for a short-lived credential.
      #
      #   NPM_TOKEN (bootstrap): a trusted publisher cannot be configured for a
      #     package that does not exist yet, so the FIRST publish of a new scope may
      #     need a token. Publish once, configure the publisher, delete the secret.
      #
      # An .npmrc with an empty token breaks OIDC, so it is only written when the
      # secret is actually set.
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "Using NPM_TOKEN (bootstrap path)."
          else
            echo "No NPM_TOKEN set; relying on Trusted Publishing (OIDC)."
            echo "If this fails with ENEEDAUTH, either configure a trusted publisher on"
            echo "npmjs.com for ${GITHUB_REPOSITORY} / $(basename "$GITHUB_WORKFLOW"), or"
            echo "set NPM_TOKEN for the first publish."
          fi

      - name: Prepare platform packages with binaries
        run: |
          node scripts/create-platform-packages.js --all

      # THE GATE. Last moment a failure is still free: the tarballs exist but nothing
      # is public. Once `npm publish` runs the version number is burned, and a
      # published version can be deprecated but never replaced.
      #
      # Reads the staged npm/ dirs offline and fails on the three defects this project
      # actually shipped: os/cpu carrying our internal names instead of Node's (so npm
      # can never match the package), a platform declared in optionalDependencies but
      # never built, and a package missing the trace-agent. All three fail silently at
      # install time.
      - name: Verify the platform matrix before publishing
        run: node scripts/publish-matrix.js --local ./npm

      # Platform packages publish FIRST, always. The main package's
      # optionalDependencies name them at this exact version, so a main package that
      # lands first briefly advertises dependencies that do not exist, and optional
      # dependency failures are silent: anyone installing in that window gets no
      # binaries and no error.
      #
      # Skipping already-published versions keeps a re-run possible. A partial failure
      # used to make the tag unrepeatable, dying on the first package with
      # EPUBLISHCONFLICT and forcing a new version number.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          DIST_TAG="${{ steps.disttag.outputs.tag }}"
          VERSION="${{ steps.disttag.outputs.version }}"

          for platform_dir in npm/*/; do
            platform=$(basename "$platform_dir")
            pkg_name=$(node -p "require('./$platform_dir/package.json').name")

            # The matrix gate above already proved every platform has both binaries, so
            # an empty bin/ here means the two disagree. Fail rather than skip: a
            # silently incomplete publish is what this pipeline exists to prevent.
            if [ ! -d "$platform_dir/bin" ] || [ -z "$(ls -A "$platform_dir/bin")" ]; then
              echo "::error::$pkg_name has no binaries, but the pre-publish matrix check passed. Refusing to publish an incomplete set."
              exit 1
            fi

            if npm view "$pkg_name@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg_name@$VERSION is already published; skipping."
              continue
            fi

            echo "Publishing $pkg_name@$VERSION under dist-tag $DIST_TAG"
            (cd "$platform_dir" && npm publish --access public --provenance --tag "$DIST_TAG")
          done

      - name: Publish main package
        run: |
          set -euo pipefail
          DIST_TAG="${{ steps.disttag.outputs.tag }}"
          VERSION="${{ steps.disttag.outputs.version }}"
          PKG=$(node -p "require('./package.json').name")

          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already published; skipping."
            exit 0
          fi

          echo "Publishing $PKG@$VERSION under dist-tag $DIST_TAG"
          npm publish --access public --provenance --tag "$DIST_TAG"

      # A prerelease must never become the default install. `npm publish --tag next`
      # avoids moving `latest`, but npm makes an exception that bites exactly once: on
      # the very first publish of a package, `latest` is set regardless of --tag,
      # because a package with no dist-tags needs one. For a new scope whose first
      # release is a prerelease, that silently makes it the default.
      - name: Assert a prerelease did not become `latest`
        if: steps.disttag.outputs.tag == 'next'
        run: |
          set -euo pipefail
          VERSION="${{ steps.disttag.outputs.version }}"
          PKG=$(node -p "require('./package.json').name")

          # Registry reads are not immediately consistent after a publish.
          for _ in $(seq 1 12); do
            LATEST=$(npm view "$PKG" dist-tags.latest 2>/dev/null || echo "")
            [ -n "$LATEST" ] && break
            sleep 5
          done

          echo "dist-tags after publish:"
          npm view "$PKG" dist-tags || true

          if [ "$LATEST" = "$VERSION" ]; then
            echo "::error::Prerelease $VERSION became dist-tag \`latest\`. Every consumer installing without a tag now gets a prerelease. Fix with: npm dist-tag add $PKG@<last stable> latest"
            exit 1
          fi
          echo "OK: latest is \"${LATEST:-<unset>}\", not the prerelease $VERSION."

      # The receipt: what actually landed on the registry, not what we believed we sent.
      #
      # MATRIX_RETRIES is load-bearing. Publishing is not read-your-writes, and a fetch
      # immediately after `npm publish` can 404 or return stale metadata. Without the
      # retry this step goes intermittently red for a reason unrelated to the release.
      #
      # --deep downloads each tarball and lists bin/ exactly rather than inferring from
      # fileCount, at a few hundred MB of transfer once per release.
      - name: Verify the published matrix
        env:
          MATRIX_RETRIES: '12'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-matrix.js --registry "$VERSION" --deep

      # The same table in the job summary and the Release body, where someone will
      # actually look, rather than only in a log that scrolls away. Non-blocking: the
      # verification above is the gate, and a failed notes edit must not fail a
      # release.
      - name: Append the matrix to the release notes
        continue-on-error: true
        env:
          MATRIX_RETRIES: '12'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-matrix.js --registry "$VERSION" --markdown > matrix.md
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"

          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          printf '\n\n' >> notes.md
          cat matrix.md >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
