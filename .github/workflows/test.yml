name: Test

on:
  # These tests are hermetic (no network, no agent binary), so every branch runs
  # them, not just PRs. "**" matches branches only, so release tag pushes stay
  # with build-release.yml instead of running this workflow twice.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Harper v5 declares engines.node "^22.18.0 || >=24.0.0", so it cannot
        # install on Node 20 at all, and the image the component deploys onto is
        # node:24-trixie. 22 and 24 are the two versions that exist in the field.
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Both configs. The root tsconfig excludes **/*.test.ts, and the
      # integration suite runs under type stripping, which erases annotations
      # without checking them; without the second command a type error in the
      # suite merges green.
      - name: Type check
        run: |
          npm run typecheck
          npm run typecheck:test

      # `npm test` is `node --test "test/**/*.test.js"`. The pattern is quoted so
      # node expands it rather than the shell, which is what makes the same
      # script work on the Windows leg.
      #
      # The glob matches *.test.js only. test/integration/*.test.ts boots a real
      # Harper via @harperfast/integration-testing and runs under
      # `npm run test:integration`.
      - name: Run npm test
        run: npm test

      # node --test exits 0 when its pattern matches nothing, so a rename or a
      # moved directory would turn the step above into a no-op that reports
      # success.
      - name: Guard against an empty test glob
        shell: bash
        run: |
          count=$(find test -type f -name '*.test.js' | wc -l | tr -d ' ')
          echo "Found $count *.test.js file(s) under test/:"
          find test -type f -name '*.test.js' | sort | sed 's/^/  /'
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.js files under test/; npm test ran nothing."
            exit 1
          fi

  # The only job that boots a real database. It proves the two claims the
  # singleton design rests on: Harper enforces `applications.allowedSpawnCommands`
  # and the `name` option, and two distinct names take two independent PID-file
  # locks (one core agent and one trace-agent per node, not one process total).
  #
  # ubuntu only. The suite skips win32, and macOS needs loopback aliases
  # (`npx harper-integration-test-setup-loopback`, which wants sudo) before the
  # harness can hand out addresses. Linux routes all of 127.0.0.0/8 by default.
  integration:
    name: integration (harper v5, ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both field versions: Harper v5's engines floor (.nvmrc's 22.18) and
        # the node:24-trixie deploy image. An explicit matrix instead of
        # node-version-file, because that key reads one version and would pin
        # this job to the floor while deploys run on 24.
        node: ["22.18", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        # The suite resolves binaries through dist/binary-manager.js.
        run: npm run build

      # harper is not a devDependency, but `npm ci` still installs the locked
      # 5.2.1: @harperfast/integration-testing names it as a required peer and
      # the lockfile pins the resolution. An explicit `npm i harper@^5.2.1`
      # here would float past that pin to whatever 5.x npm serves today.

      # The Datadog-binary suite skips itself with a reason when the platform
      # package has no built binaries, so this passes on a checkout that has
      # never run a release build. The Harper-enforcement suite uses its own stub
      # and always runs.
      - name: Run Harper integration tests
        run: npm run test:integration
