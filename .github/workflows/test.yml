name: Test

on:
  # These tests are hermetic (no network, no agent binary), so every branch runs
  # them, not just PRs. "**" matches branches only, so release tag pushes stay
  # with build-release.yml instead of running this workflow twice.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Harper v5 declares engines.node "^22.18.0 || >=24.0.0", so it cannot
        # install on Node 20 at all, and the image the component deploys onto is
        # node:24-trixie. 22 and 24 are the two versions that exist in the field.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    # A green leg is well under a minute of work; the Windows legs measured 35-44s
    # end to end. This is sized against `npm ci` on a cold cache, not against the
    # suite, and exists so a runner that never schedules fails in minutes instead
    # of holding the default six hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Both configs. The root tsconfig excludes **/*.test.ts, and the
      # integration suite runs under type stripping, which erases annotations
      # without checking them; without the second command a type error in the
      # suite merges green.
      - name: Type check
        run: |
          npm run typecheck
          npm run typecheck:test

      # `npm test` is `node --test "test/**/*.test.js"`. The pattern is quoted so
      # node expands it rather than the shell, which is what makes the same
      # script work on the Windows leg.
      #
      # The glob matches *.test.js only. test/integration/*.test.ts boots a real
      # Harper via @harperfast/integration-testing and runs under
      # `npm run test:integration`.
      - name: Run npm test
        run: npm test

      # node --test exits 0 when its pattern matches nothing, so a rename or a
      # moved directory would turn the step above into a no-op that reports
      # success.
      - name: Guard against an empty test glob
        shell: bash
        run: |
          count=$(find test -type f -name '*.test.js' | wc -l | tr -d ' ')
          echo "Found $count *.test.js file(s) under test/:"
          find test -type f -name '*.test.js' | sort | sed 's/^/  /'
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.js files under test/; npm test ran nothing."
            exit 1
          fi

  # "Change both or neither" as an assertion instead of a comment. build-verify.yml
  # and build-release.yml deliberately run the same build and the same receiver
  # check, and keeping the two in step by hand did not hold: the verifying workflow
  # ended up grepping /info for a string while the publishing workflow parsed the
  # endpoints array, so a body advertising nothing at all passed the check that only
  # verifies and would have failed the check that ships.
  #
  # Compares the `run:` bodies byte for byte. What legitimately differs between the
  # two workflows arrives through the step `env:`, which is not compared.
  workflow-drift:
    name: shared workflow steps are identical
    runs-on: ubuntu-latest
    # Reads two files and compares strings; the ceiling is the runner starting at
    # all.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No setup-node and no npm ci: the extractor reads the workflow files as text,
      # so the runner image Node is enough and the job costs a checkout.
      - name: Compare the steps the two build workflows share
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");

            // Text extraction rather than a YAML parse, because a parser means an
            // npm ci for one string comparison. The shape read here is fixed:
            // `run: |` followed by a block indented past it. Anything else throws
            // rather than silently comparing nothing.
            const body = (file, step) => {
              const lines = readFileSync(`.github/workflows/${file}`, "utf8").split("\n");
              const start = lines.findIndex((line) => line.trim() === `- name: ${step}`);
              if (start === -1) throw new Error(`${file}: no step named "${step}"`);
              let run = -1;
              for (let i = start + 1; i < lines.length && !/^\s*- name: /.test(lines[i]); i++) {
                if (/^\s+run: \|\s*$/.test(lines[i])) {
                  run = i;
                  break;
                }
              }
              if (run === -1) throw new Error(`${file}: step "${step}" has no literal run block`);
              const keyIndent = lines[run].search(/\S/);
              const block = [];
              for (let i = run + 1; i < lines.length; i++) {
                if (lines[i].trim() !== "" && lines[i].search(/\S/) <= keyIndent) break;
                block.push(lines[i]);
              }
              while (block.length && block[block.length - 1].trim() === "") block.pop();
              const pad = block.find((line) => line.trim() !== "").match(/^ */)[0];
              return block.map((line) => line.slice(pad.length)).join("\n");
            };

            const shared = [
              "Reclaim disk space (Linux)",
              "Report free disk space (Windows)",
              "Build both agent binaries (Unix)",
              "Build both agent binaries (Windows)",
              "Assert the trace binary contains the APM receiver",
              "Verify the APM receiver accepts a trace (Unix)",
              "Verify the APM receiver accepts a trace (Windows)",
            ];

            let failed = 0;
            for (const step of shared) {
              const verify = body("build-verify.yml", step).split("\n");
              const release = body("build-release.yml", step).split("\n");
              const at = verify.findIndex((line, i) => line !== release[i]);
              if (at === -1 && verify.length === release.length) {
                console.log(`same: ${step} (${verify.length} lines)`);
                continue;
              }
              failed++;
              const i = at === -1 ? Math.min(verify.length, release.length) : at;
              console.log(`::error::"${step}" differs between the two build workflows, first at line ${i + 1}.`);
              console.log(`  build-verify.yml : ${verify[i] ?? "(end of body)"}`);
              console.log(`  build-release.yml: ${release[i] ?? "(end of body)"}`);
            }
            if (failed) {
              console.log("::error::Change both files or neither. Per-workflow differences belong in the step env:, not in the run body.");
              process.exitCode = 1;
            }
          '

  # The only job that boots a real database. It proves the two claims the
  # singleton design rests on: Harper enforces `applications.allowedSpawnCommands`
  # and the `name` option, and two distinct names take two independent PID-file
  # locks (one core agent and one trace-agent per node, not one process total).
  #
  # ubuntu only. The suite skips win32, and macOS needs loopback aliases
  # (`npx harper-integration-test-setup-loopback`, which wants sudo) before the
  # harness can hand out addresses. Linux routes all of 127.0.0.0/8 by default.
  integration:
    name: integration (harper v5, ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Five real Harper instances boot over the run, 40-95s locally across repeated
    # runs. The ceiling is the suite's own waits rather than its measured time:
    # pollJsonlRows() gives each probing suite 60s before it gives up, and every one
    # of those has to be able to expire and still report.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both field versions: Harper v5's engines floor (.nvmrc's 22.18) and
        # the node:24-trixie deploy image. An explicit matrix instead of
        # node-version-file, because that key reads one version and would pin
        # this job to the floor while deploys run on 24.
        node: ['22.18', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        # The suite resolves binaries through dist/binary-manager.js.
        run: npm run build

      # harper is not a devDependency, but `npm ci` still installs the locked
      # 5.2.1: @harperfast/integration-testing names it as a required peer and
      # the lockfile pins the resolution. An explicit `npm i harper@^5.2.1`
      # here would float past that pin to whatever 5.x npm serves today.

      # The Datadog-binary suite skips itself with a reason when the platform
      # package has no built binaries, so this passes on a checkout that has
      # never run a release build. The Harper-enforcement suite uses its own stub
      # and always runs.
      - name: Run Harper integration tests
        run: npm run test:integration

  # An early warning on the way into main, not a gate: build-release.yml runs the
  # same script on the tag, and only that run decides anything. The registry and the
  # token move on their own, so a green answer here vouches for nothing later. What
  # it buys is finding a dead publish path while the PR is open instead of after a
  # tag has spent an hour building four Go agents.
  #
  # It lives here rather than behind a `pull_request` trigger on build-release.yml
  # because that trigger makes the whole workflow PR-runnable, and its build job
  # carries no `if:`. Every PR would start four Go agent builds, and the `if:` that
  # stopped them would skip the jobs downstream of it as well.
  #
  # Same-repo PRs only. A fork PR gets an empty NPM_TOKEN, and the script reads that
  # as "no token, and none of the five names is published", so the job would fail on
  # a condition it created itself.
  preflight:
    name: release preflight (early warning)
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Five registry reads and no install; ~2s against a live registry. The margin is
    # for a registry that answers slowly rather than not at all, which is the case
    # the script's own 3-attempt backoff already rides out.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Check the publish path
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-preflight.js
