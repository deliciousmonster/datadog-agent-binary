name: Cut Prerelease

# Creates and pushes the next `-next.N` tag, which triggers build-release.yml.
#
# Runs automatically on every push to main, and manually via workflow_dispatch.
# Either way, no tag is cut until the commit's Test workflow run has succeeded.
#
# This exists so nobody hand-types a release tag. The tag is the only input to the
# publish pipeline: it sets the npm version, and whether it parses as a semver
# prerelease decides whether the build lands on `next` or takes over `latest` for every
# consumer. A typo there is a bad default install, not a typo.
#
# The next prerelease number is the highest already taken in EITHER the registry or the
# git tags, plus one. Registry alone is not enough: a tag that failed to publish still
# burns its number, and on a scope that is not published yet every lookup 404s and every
# run would compute the same `.0`.

on:
  push:
    branches: [main]
    # A docs-only change does not need its own build of the Go agent. example/
    # is ignored because it no longer ships in the tarball (files[] in
    # package.json); an example-only change reaches nobody through npm, so a
    # release would rebuild four Go agents to publish identical content.
    paths-ignore:
      - '**/*.md'
      - 'example/**'
  workflow_dispatch:
    inputs:
      base:
        description: 'Base version, e.g. 7.75.6. Default: the version in package.json.'
        required: false
      channel:
        description: 'Prerelease channel'
        required: false
        default: 'next'
        type: choice
        options:
          - next
          - rc
      dry_run:
        description: 'Compute and print the tag without creating it'
        required: false
        default: true
        type: boolean

# Two pushes landing together must not compute the same N. Queue, never cancel:
# a cancelled run leaves a commit on main with no release.
concurrency:
  group: cut-prerelease
  cancel-in-progress: false

jobs:
  cut:
    name: compute and push the tag
    runs-on: ubuntu-latest
    # Sized off the "Require a green Test run" step below, which waits 60 * 30s by
    # design and reports its own failure at that bound. Anything under 30 minutes
    # here would take that decision away from it and kill a healthy wait instead.
    timeout-minutes: 40
    # `[skip release]` in the subject is the escape hatch for a push that should not
    # ship, e.g. a CI-only fix that would otherwise build four Go agents to prove nothing.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    permissions:
      # Read, not write: the tag is pushed with REPO_TOKEN (the PAT persisted by
      # checkout), never with GITHUB_TOKEN, so write here would only widen what a
      # compromised step could reach.
      contents: read
      # The Test gate below reads workflow runs with the default GITHUB_TOKEN.
      actions: read
    steps:
      # Two states look identical from CI and must not: "releases are not turned
      # on yet" (green, nothing was promised) and "releases are on and broken"
      # (red, something silently stopped shipping). A secret alone cannot tell
      # them apart, so the RELEASE_ENABLED repo variable records the intent.
      # Arming a release is then deliberately two actions - set the variable and
      # add the tokens - and doing only one of them fails loudly.
      - name: Determine release mode
        id: arm
        env:
          # Both through env, never interpolated into the script: `${{ }}` is
          # spliced in as text before bash parses the line, so a variable holding
          # shell syntax would run inside a step that carries the PAT.
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          # Exactly true, exactly false, or unset. Treating an unrecognized value
          # as "not armed" would rebuild the very conflation this gate removes:
          # someone who typed `True` believes releases are on, and every run
          # would stay green while nothing ever shipped.
          case "${RELEASE_ENABLED:-false}" in
            true) ;;
            false)
              echo "armed=false" >> "$GITHUB_OUTPUT"
              echo "Releases are not enabled. Computing the next version for the record; no tag, no publish."
              exit 0
              ;;
            *)
              echo "::error::RELEASE_ENABLED is '${RELEASE_ENABLED}', which is neither 'true' nor 'false'. Refusing to guess: if this was meant to arm releases, the run would otherwise stay green forever while shipping nothing."
              exit 1
              ;;
          esac
          if [ -z "${REPO_TOKEN}" ]; then
            echo "::error::RELEASE_ENABLED is 'true' but REPO_TOKEN is not set. A tag pushed with the default GITHUB_TOKEN does not start another workflow, so build-release.yml would never run and this job would report success while shipping nothing. Add a PAT with contents:write as REPO_TOKEN, or set RELEASE_ENABLED to 'false' to go back to reporting-only runs."
            exit 1
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"
          echo "Releases are enabled and REPO_TOKEN is present."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does NOT start another workflow,
          # so build-release.yml would never see it and this job would report success
          # while shipping nothing. A PAT is the only thing that makes the chain fire.
          # The fallback is what lets an unarmed run still read tags and report the
          # version it would have cut; checkout rejects an empty token outright.
          token: ${{ secrets.REPO_TOKEN || github.token }}
          # Persisting is what lets `git push origin <tag>` below reuse the PAT.
          # An unarmed run never pushes, so leaving a credential in .git/config
          # for the rest of the job would arm nothing but an attacker.
          persist-credentials: ${{ steps.arm.outputs.armed == 'true' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Compute the next prerelease version
        id: next
        env:
          # Same reason as the arm step above, and it applies to every dispatch
          # input, not just secrets: this job holds the PAT that pushes the tag.
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_BASE: ${{ github.event.inputs.base }}
        run: |
          set -euo pipefail

          CHANNEL="${INPUT_CHANNEL:-}"
          [ -z "$CHANNEL" ] && CHANNEL="next"
          PKG=$(node -p "require('./package.json').name")

          # An explicit base is a floor, not an override: it still has to clear whatever
          # is already released, or the run fails rather than shipping a lower version.
          PKG_VERSION="${INPUT_BASE:-}"
          if [ -z "$PKG_VERSION" ]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
          fi

          echo "Package: $PKG"
          echo "Channel: $CHANNEL"
          echo "package.json floor: $PKG_VERSION"

          # A 404 (scope not published yet) is the normal bootstrap case, not an error.
          PUBLISHED=$(npm view "$PKG" versions --json 2>/dev/null || echo "[]")
          # Every version ever tagged, including the ones whose publish step failed. The
          # registry cannot see those and would hand their number out twice.
          TAGS=$(git tag -l 'v*' | tr '\n' ' ')

          echo "Registry versions: $(echo "$PUBLISHED" | head -c 200)"

          NEXT=$(node scripts/next-prerelease.js \
            --channel "$CHANNEL" \
            --tags "$TAGS" \
            --registry "$PUBLISHED" \
            --package-version "$PKG_VERSION")

          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      # Taking the max of both sources should make this unreachable. It stays because the
      # failure it guards against is silent: an existing tag is either rejected by the
      # push or does nothing, leaving someone waiting for a release that never runs.
      - name: Check the tag is free
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on the remote."
            exit 1
          fi
          echo "OK: $TAG is free."

      # A manual run defaults to a dry run so nobody ships by clicking the wrong button.
      # An automatic run is the point of the workflow and always pushes.
      - name: Decide whether to push
        id: mode
        env:
          ARMED: ${{ steps.arm.outputs.armed }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${ARMED}" = 'true' ]; then
            if [ "${EVENT}" = 'push' ]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
              echo "Automatic run: pushing the tag."
            elif [ "${DRY_RUN}" = 'true' ]; then
              echo "push=false" >> "$GITHUB_OUTPUT"
              echo "Dry run: nothing will be created."
            else
              echo "push=true" >> "$GITHUB_OUTPUT"
              echo "Manual run with dry_run=false: pushing the tag."
            fi
            exit 0
          fi
          # A push to main promised nothing, so reporting the version and stopping
          # is honest. Dispatching with dry_run=false IS the promise, and answering
          # it green would be the silent no-op this whole gate exists to prevent.
          if [ "${EVENT}" != 'push' ] && [ "${DRY_RUN}" != 'true' ]; then
            echo "::error::A release was requested (dry_run=false) but releases are not enabled, so no tag can be cut. Set RELEASE_ENABLED to 'true' and add REPO_TOKEN and NPM_TOKEN first."
            exit 1
          fi
          echo "push=false" >> "$GITHUB_OUTPUT"
          echo "Releases are not enabled; nothing will be created."

      # REPO_TOKEN gets the tag pushed and buys nothing at registry.npmjs.org. The
      # publish in build-release.yml fails only after every platform's Go build:
      # ENEEDAUTH on a name Trusted Publishing cannot bootstrap, or a provenance
      # rejection when repository.url does not match the building repo. The script
      # checks all five package names and both failure classes in seconds, before
      # the tag exists. build-release.yml runs the same script, because a
      # hand-pushed tag never comes through here.
      - name: Release preflight
        if: steps.mode.outputs.push == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-preflight.js

      # A tag must never be cut for a commit whose Test workflow failed. This
      # polls rather than moving to a workflow_run trigger: workflow_run cannot
      # carry this workflow's paths-ignore filter or its dispatch inputs, so
      # the push trigger, the `[skip release]` hatch, and manual runs all stay
      # exactly as they are.
      #
      # Test starts from the same push that starts this run, so it is usually
      # still going; the concurrency queue above means waiting here holds no
      # one up but a later release. Fail-closed when no Test run exists at
      # all: a commit that never ran Test is precisely what must not ship, and
      # test.yml has workflow_dispatch to arm an old commit by hand.
      - name: Require a green Test run for this commit
        if: steps.mode.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 60 * 30s = 30 minutes. The Test matrix plus the integration job
          # finish well inside that; past it something is wedged and a human
          # should look before a release does.
          for i in $(seq 1 60); do
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "absent absent" else "\(.status) \(.conclusion)" end')
            read -r STATUS CONCLUSION <<<"$RUN"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Test succeeded for ${GITHUB_SHA}."
                exit 0
              fi
              echo "::error::Test concluded '${CONCLUSION}' for ${GITHUB_SHA}; refusing to cut a tag. Fix the commit or re-run Test until it is green."
              exit 1
            fi
            echo "Test is ${STATUS} for ${GITHUB_SHA}; waiting... ($i/60)"
            sleep 30
          done
          echo "::error::Test never completed for ${GITHUB_SHA} within 30 minutes; refusing to cut a tag."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Prerelease"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.next.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.next.outputs.tag }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Pushed | \`${{ steps.mode.outputs.push }}\` |"
            echo ""
            if [ "${{ steps.arm.outputs.armed }}" != 'true' ]; then
              echo "**Releases are not enabled, so nothing was tagged or published.**"
              echo ""
              echo "This run is green on purpose: it computed the version it would"
              echo "have cut and stopped. Nothing is on npm under this scope yet."
              echo ""
              echo "To start releasing, do both, in this order:"
              echo ""
              echo "1. Add the secrets: \`REPO_TOKEN\` (a PAT with contents:write, so the"
              echo "   pushed tag starts build-release.yml) and \`NPM_TOKEN\` (needed for the"
              echo "   first publish of each package name; Trusted Publishing cannot"
              echo "   bootstrap a name that has never been published)."
              echo "2. Set the repository variable \`RELEASE_ENABLED\` to \`true\`."
              echo ""
              echo "Setting the variable without the secrets fails this job loudly, which"
              echo "is the point: once releases are promised, silence is a defect."
            elif [ "${{ steps.mode.outputs.push }}" != 'true' ]; then
              echo "**Dry run: the tag above was computed but not created.**"
              echo ""
              echo "Re-run with \`dry_run: false\` to cut it."
            else
              echo "Consumers install it with:"
              echo ""
              echo '```bash'
              echo "npm install $(node -p "require('./package.json').name")@next"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push the tag
        if: steps.mode.outputs.push == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Prerelease $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG. build-release.yml will now build and publish it."

      # Two different reasons to have created nothing, and telling someone to
      # re-run with dry_run=false is wrong advice for the unarmed one.
      - name: Explain why nothing was created
        if: steps.mode.outputs.push != 'true'
        run: |
          if [ "${{ steps.arm.outputs.armed }}" != 'true' ]; then
            echo "Releases are not enabled (RELEASE_ENABLED is not 'true'), so no tag was cut and nothing was published."
            echo "Next version, once releases are turned on: ${{ steps.next.outputs.tag }}"
            echo "See the job summary for the two steps that arm a release."
          else
            echo "Dry run: nothing was created."
            echo "Re-run with dry_run=false to push ${{ steps.next.outputs.tag }}."
          fi
