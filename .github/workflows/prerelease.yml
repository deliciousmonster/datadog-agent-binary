name: Cut Prerelease

# Creates and pushes the next `-next.N` tag, which triggers build-release.yml.
#
# Runs automatically on every push to main, and manually via workflow_dispatch.
#
# This exists so nobody hand-types a release tag. The tag is the only input to the
# publish pipeline: it sets the npm version, and whether it parses as a semver
# prerelease decides whether the build lands on `next` or takes over `latest` for every
# consumer. A typo there is a bad default install, not a typo.
#
# The next prerelease number is the highest already taken in EITHER the registry or the
# git tags, plus one. Registry alone is not enough: a tag that failed to publish still
# burns its number, and on a scope that is not published yet every lookup 404s and every
# run would compute the same `.0`.

on:
  push:
    branches: [main]
    # A docs-only change does not need its own build of the Go agent.
    paths-ignore:
      - "**/*.md"
      - "example/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Base version, e.g. 7.75.6. Default: the version in package.json."
        required: false
      channel:
        description: "Prerelease channel"
        required: false
        default: "next"
        type: choice
        options:
          - next
          - rc
      dry_run:
        description: "Compute and print the tag without creating it"
        required: false
        default: true
        type: boolean

# Two pushes landing together must not compute the same N. Queue, never cancel:
# a cancelled run leaves a commit on main with no release.
concurrency:
  group: cut-prerelease
  cancel-in-progress: false

jobs:
  cut:
    name: compute and push the tag
    runs-on: ubuntu-latest
    # `[skip release]` in the subject is the escape hatch for a push that should not
    # ship, e.g. a CI-only fix that would otherwise build four Go agents to prove nothing.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    permissions:
      contents: write
    steps:
      # Without this the run dies inside actions/checkout with "Input required and not
      # supplied: token", which reads like a broken workflow rather than a missing secret.
      - name: Require REPO_TOKEN
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_TOKEN}" ]; then
            echo "::error::REPO_TOKEN is not set. A tag pushed with the default GITHUB_TOKEN does not start another workflow, so build-release.yml would never run and this job would report success while shipping nothing. Add a PAT with contents:write as REPO_TOKEN."
            exit 1
          fi
          echo "REPO_TOKEN is present."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does NOT start another workflow,
          # so build-release.yml would never see it and this job would report success
          # while shipping nothing. A PAT is the only thing that makes the chain fire.
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Compute the next prerelease version
        id: next
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"
          [ -z "$CHANNEL" ] && CHANNEL="next"
          PKG=$(node -p "require('./package.json').name")

          # An explicit base is a floor, not an override: it still has to clear whatever
          # is already released, or the run fails rather than shipping a lower version.
          PKG_VERSION="${{ github.event.inputs.base }}"
          if [ -z "$PKG_VERSION" ]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
          fi

          echo "Package: $PKG"
          echo "Channel: $CHANNEL"
          echo "package.json floor: $PKG_VERSION"

          # A 404 (scope not published yet) is the normal bootstrap case, not an error.
          PUBLISHED=$(npm view "$PKG" versions --json 2>/dev/null || echo "[]")
          # Every version ever tagged, including the ones whose publish step failed. The
          # registry cannot see those and would hand their number out twice.
          TAGS=$(git tag -l 'v*' | tr '\n' ' ')

          echo "Registry versions: $(echo "$PUBLISHED" | head -c 200)"

          NEXT=$(node scripts/next-prerelease.js \
            --channel "$CHANNEL" \
            --tags "$TAGS" \
            --registry "$PUBLISHED" \
            --package-version "$PKG_VERSION")

          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      # Taking the max of both sources should make this unreachable. It stays because the
      # failure it guards against is silent: an existing tag is either rejected by the
      # push or does nothing, leaving someone waiting for a release that never runs.
      - name: Check the tag is free
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on the remote."
            exit 1
          fi
          echo "OK: $TAG is free."

      # A manual run defaults to a dry run so nobody ships by clicking the wrong button.
      # An automatic run is the point of the workflow and always pushes.
      - name: Decide whether to push
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Automatic run: pushing the tag."
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: nothing will be created."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Manual run with dry_run=false: pushing the tag."
          fi

      # REPO_TOKEN gets the tag pushed and buys nothing at registry.npmjs.org. The
      # publish in build-release.yml fails only after every platform's Go build:
      # ENEEDAUTH on a name Trusted Publishing cannot bootstrap, or a provenance
      # rejection when repository.url does not match the building repo. The script
      # checks all five package names and both failure classes in seconds, before
      # the tag exists. build-release.yml runs the same script, because a
      # hand-pushed tag never comes through here.
      - name: Release preflight
        if: steps.mode.outputs.push == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-preflight.js

      - name: Summary
        run: |
          {
            echo "### Prerelease"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.next.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.next.outputs.tag }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Pushed | \`${{ steps.mode.outputs.push }}\` |"
            echo ""
            echo "Consumers install it with:"
            echo ""
            echo '```bash'
            echo "npm install $(node -p "require('./package.json').name")@next"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push the tag
        if: steps.mode.outputs.push == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Prerelease $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG. build-release.yml will now build and publish it."

      - name: Dry run notice
        if: steps.mode.outputs.push != 'true'
        run: |
          echo "Dry run: nothing was created."
          echo "Re-run with dry_run=false to push ${{ steps.next.outputs.tag }}."
